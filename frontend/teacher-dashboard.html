<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Espace Enseignant | Harmonie-Retrouvailles</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://meet.jit.si/external_api.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #0a192f; }
    .font-display { font-family: 'Playfair Display', serif; }
    .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
    .glass-light { background: rgba(255,255,255,0.07); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    .sidebar-link { display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;color:rgba(255,255,255,0.6);transition:all .2s;cursor:pointer; }
    .sidebar-link:hover, .sidebar-link.active { background:rgba(255,255,255,0.08);color:#fff; }
    .sidebar-link.active { border-left: 3px solid #f59e0b; padding-left: 13px; }
    .tab-active { background: #f59e0b; color: #0a192f; }
    .tab-inactive { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.6); }
    .badge-green { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.25); }
    .badge-red { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.25); }
    .badge-amber { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.25); }
    .kpi-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 24px; transition: all .3s; }
    .kpi-card:hover { background: rgba(255,255,255,0.08); transform: translateY(-2px); }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
  </style>
</head>
<body class="text-white min-h-screen flex flex-col md:flex-row overflow-x-hidden">
  <!-- BANNIÈRE EXÉCUTIVE DIRECTION GÉNÉRALE -->
  <div id="dg-executive-banner" class="hidden fixed top-0 left-0 right-0 z-50 bg-gradient-to-r from-amber-600 via-yellow-600 to-amber-700 text-gray-950 px-4 py-2 flex items-center justify-between text-xs font-black shadow-xl">
    <div class="flex items-center gap-2">
      <span>🏛️</span>
      <span class="tracking-wide uppercase">Session Direction Générale — Mode Supervision Pédagogique</span>
    </div>
    <a href="/admin-dashboard.html" class="px-3 py-1 rounded-lg bg-gray-950 text-amber-300 font-black hover:bg-black transition shadow">↩ Retour au Tableau de Bord Central</a>
  </div>


  <!-- SIDEBAR -->
  <aside class="w-full md:w-64 md:min-h-screen glass flex flex-col py-6 px-4 shrink-0 md:fixed md:left-0 md:top-0 md:bottom-0 z-40">
    <!-- Logo -->
    <div class="flex items-center gap-3 px-2 mb-8">
      <div class="w-10 h-10 bg-[#0a192f] border-2 border-amber-500 flex items-center justify-center font-display font-bold text-base rounded-lg">HR</div>
      <div>
        <p class="font-black text-sm leading-tight">Espace</p>
        <p class="text-amber-400 text-xs font-bold">Enseignant</p>
      </div>
    </div>

    <!-- Nav -->
    <nav class="space-y-1 flex-1">
      <div class="sidebar-link active" onclick="showView('accueil')">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Vue d'ensemble
      </div>
      <div class="sidebar-link" onclick="showView('presences')">
        <i data-lucide="user-check" class="w-5 h-5"></i> Présences Élèves
      </div>
      <div class="sidebar-link" onclick="showView('cahier')">
        <i data-lucide="book-open" class="w-5 h-5"></i> Cahier de Texte
      </div>
      <div class="sidebar-link" onclick="showView('notes')">
        <i data-lucide="bar-chart-2" class="w-5 h-5"></i> Saisie des Notes
      </div>
      <div class="sidebar-link" onclick="showView('planning')">
        <i data-lucide="calendar" class="w-5 h-5"></i> Mon Planning
      </div>
      <div class="sidebar-link" onclick="showView('visio')">
        <i data-lucide="video" class="w-5 h-5"></i> Classe Virtuelle
      </div>
      <div class="sidebar-link" onclick="showView('messagerie')">
        <i data-lucide="message-circle" class="w-5 h-5"></i> Messagerie Direction
        <span class="ml-auto bg-red-500 text-white text-[10px] font-black px-2 py-0.5 rounded-full">2</span>
      </div>
    </nav>

    <!-- User -->
    <div class="mt-auto">
      <div class="glass-light p-4 rounded-2xl mb-3">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-amber-500/20 border border-amber-500/30 flex items-center justify-center text-amber-400 font-black text-sm" id="teacher-avatar">--</div>
          <div>
            <p class="font-bold text-sm" id="teacher-name">---</p>
            <p class="text-[11px] text-gray-400" id="teacher-role">Enseignant</p>
          </div>
        </div>
      </div>
      <button onclick="localStorage.removeItem('hr_user'); localStorage.removeItem('hr_token'); window.location.href='/login.html'" class="w-full flex items-center gap-2 px-4 py-2.5 rounded-xl text-red-400 hover:bg-red-500/10 transition text-sm font-bold">
        <i data-lucide="log-out" class="w-4 h-4"></i> Déconnexion
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="md:ml-64 flex-1 p-4 md:p-8" id="main-content">
    <!-- Views dynamically injected -->
  </main>

  <script>
    const userStr = localStorage.getItem('hr_user');
    if (!userStr) {
      window.location.href = '/login.html';
      throw new Error('Non connecté');
    }
    const user = JSON.parse(userStr);
    if (!user) {
      window.location.href = '/login.html';
      throw new Error('Session invalide');
    }

    // Vérification de sécurité : le compte existe-t-il toujours dans la base active ?
    const activeDb = JSON.parse(localStorage.getItem('hr_users_db_v2')) || [];
    const dummyEmails = ['kasombo@retrouvailles.cd', 'matungulu@retrouvailles.cd', 'enseignant@retrouvailles.cd', 'compta@retrouvailles.cd', 'parent@retrouvailles.cd'];
    const isSuperAdminUser = user.email && (user.email.toLowerCase() === 'chadrackisoloke@gmail.com' || user.email.toLowerCase() === 'admin@retrouvailes.cd');
    const isDummy = user.email && dummyEmails.includes(user.email.toLowerCase());
    const existsInDb = activeDb.some(u => u.email && u.email.toLowerCase() === (user.email || '').toLowerCase());

    if (isDummy || (!isSuperAdminUser && !existsInDb)) {
      localStorage.removeItem('hr_user');
      localStorage.removeItem('hr_token');
      alert("⛔ Session expirée : Ce compte n'existe plus ou a été purgé par l'administrateur.");
      window.location.href = '/login.html';
      throw new Error('Compte inexistant');
    }

    // STRICT RBAC CHECK: Accès réservé au corps enseignant et à la Direction
    const allowedTeacherRoles = ['Enseignant', 'Professeur', 'Instituteur', 'Institutrice', 'Super-Admin', 'Direction', 'Direction Générale'];
    if (!allowedTeacherRoles.includes(user.role)) {
      alert("⛔ ACCÈS REFUSÉ — SÉCURITÉ EPST\n\nAccès réservé exclusivement au Corps Enseignant.");
      if (user.role === 'Parent') window.location.href = '/parent-dashboard.html';
      else if (user.role === 'Comptable') window.location.href = '/compta-dashboard.html';
      else if (['Préfet', 'D.E', 'D.D', 'Sur École'].includes(user.role)) window.location.href = '/prefet-dashboard.html';
      else window.location.href = '/login.html';
      throw new Error('Unauthorized');
    }

    // Affichage du nom complet et du rôle exact choisi lors de l'inscription
    const fullName = [user.prenom, user.nom].filter(Boolean).join(' ');
    document.getElementById('teacher-name').textContent = fullName || 'Inconnu';
    if (user.role === 'Direction Générale' || user.role === 'Super-Admin') { const b = document.getElementById('dg-executive-banner'); if (b) b.classList.remove('hidden'); }
    document.getElementById('teacher-role').textContent = user.role || 'Agent';
    const initials = ((user.prenom || '')[0] || '') + ((user.nom || '')[0] || '');
    document.getElementById('teacher-avatar').textContent = initials.toUpperCase() || '?';

    const mockClasses = (user && user.classes && user.classes.length > 0) ? user.classes : ['Classe Affectée'];
    const mockEleves = []; // Zéro élève fictif : en attente des inscriptions officielles

    function setActiveLink(viewName) {
      document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
      const links = document.querySelectorAll('.sidebar-link');
      const map = { accueil:0, presences:1, cahier:2, notes:3, planning:4, visio:5, messagerie:6 };
      if (links[map[viewName]]) links[map[viewName]].classList.add('active');
    }

    function showView(name) {
      setActiveLink(name);
      const c = document.getElementById('main-content');
      switch(name) {
        case 'accueil': c.innerHTML = viewAccueil(); break;
        case 'presences': c.innerHTML = viewPresences(); break;
        case 'cahier': c.innerHTML = viewCahier(); break;
        case 'notes': c.innerHTML = viewNotes(); break;
        case 'planning': c.innerHTML = viewPlanning(); break;
        case 'visio': c.innerHTML = viewVisio(); setTimeout(initVirtualClassTeacher, 300); break;
        case 'messagerie': c.innerHTML = viewMessagerie(); break;
      }
      if (window.lucide) lucide.createIcons();
    }

    function viewAccueil() {
      return `
        <div class="mb-8">
          <h2 class="text-3xl font-black uppercase tracking-tighter">Bonjour, ${user.prenom} 👋</h2>
          <p class="text-xs text-gray-400 font-bold mt-1 uppercase tracking-widest">Tableau de bord — ${new Date().toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'})}</p>
        </div>

        <!-- KPIs -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
          <div class="kpi-card">
            <div class="w-10 h-10 rounded-xl bg-blue-500/20 flex items-center justify-center mb-3"><i data-lucide="users" class="w-5 h-5 text-blue-400"></i></div>
            <div class="text-2xl font-black">3</div>
            <div class="text-xs text-gray-400 uppercase tracking-widest mt-1">Classes</div>
          </div>
          <div class="kpi-card">
            <div class="w-10 h-10 rounded-xl bg-green-500/20 flex items-center justify-center mb-3"><i data-lucide="user-check" class="w-5 h-5 text-green-400"></i></div>
            <div class="text-2xl font-black">87<span class="text-sm font-normal text-gray-400">%</span></div>
            <div class="text-xs text-gray-400 uppercase tracking-widest mt-1">Présence moy.</div>
          </div>
          <div class="kpi-card">
            <div class="w-10 h-10 rounded-xl bg-amber-500/20 flex items-center justify-center mb-3"><i data-lucide="book-open" class="w-5 h-5 text-amber-400"></i></div>
            <div class="text-2xl font-black">12</div>
            <div class="text-xs text-gray-400 uppercase tracking-widest mt-1">Devoirs envoyés</div>
          </div>
          <div class="kpi-card">
            <div class="w-10 h-10 rounded-xl bg-purple-500/20 flex items-center justify-center mb-3"><i data-lucide="bar-chart-2" class="w-5 h-5 text-purple-400"></i></div>
            <div class="text-2xl font-black">14.2</div>
            <div class="text-xs text-gray-400 uppercase tracking-widest mt-1">Moyenne générale</div>
          </div>
        </div>

        <!-- Classes + Cours du jour -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div class="glass p-6 rounded-2xl">
            <h3 class="font-black text-base uppercase tracking-wider mb-4 flex items-center gap-2"><i data-lucide="layers" class="w-5 h-5 text-amber-400"></i> Mes Classes</h3>
            <div class="space-y-3">
              ${mockClasses.map((cls, i) => `
                <div class="flex items-center justify-between p-3 bg-[#112240]/80/5 rounded-xl hover:bg-[#112240]/80/10 transition cursor-pointer" onclick="showView('presences')">
                  <div>
                    <p class="font-bold text-sm">${cls}</p>
                    <p class="text-xs text-gray-400">${[32,28,35][i]} élèves</p>
                  </div>
                  <i data-lucide="chevron-right" class="w-4 h-4 text-gray-500"></i>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="glass p-6 rounded-2xl">
            <h3 class="font-black text-base uppercase tracking-wider mb-4 flex items-center gap-2"><i data-lucide="clock" class="w-5 h-5 text-blue-400"></i> Prochains Cours Aujourd'hui</h3>
            <div class="space-y-3">
              ${[
                { heure: '08h00 – 09h30', classe: '3ème Humanités', salle: 'B12', statut: 'terminé' },
                { heure: '10h00 – 11h30', classe: '2ème Humanités', salle: 'A07', statut: 'en cours' },
                { heure: '14h00 – 15h30', classe: '1ère Primaire', salle: 'C03', statut: 'à venir' },
              ].map(c => `
                <div class="flex items-center gap-3 p-3 bg-[#112240]/80/5 rounded-xl">
                  <div class="text-xs font-mono text-gray-400 w-28 flex-shrink-0">${c.heure}</div>
                  <div class="flex-1">
                    <p class="font-bold text-sm">${c.classe}</p>
                    <p class="text-[11px] text-gray-500">Salle ${c.salle}</p>
                  </div>
                  <span class="px-2 py-1 rounded-full text-[10px] font-black uppercase ${c.statut==='terminé'?'badge-green':c.statut==='en cours'?'badge-amber':'badge-red'}">${c.statut}</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>`;
    }

    function viewPresences() {
      return `
        <div class="mb-8 flex items-end justify-between">
          <div>
            <h2 class="text-3xl font-black uppercase tracking-tighter">Présences Élèves</h2>
            <p class="text-xs text-gray-400 font-bold mt-1 uppercase tracking-widest">Pointage journalier par classe</p>
          </div>
          <button onclick="alert('Présences sauvegardées !')" class="px-6 py-3 bg-amber-500 text-[#0a192f] font-black rounded-xl hover:bg-amber-400 transition shadow-lg flex items-center gap-2">
            <i data-lucide="save" class="w-4 h-4"></i> Enregistrer
          </button>
        </div>

        <div class="glass p-2 rounded-2xl flex gap-2 mb-6 w-fit">
          ${mockClasses.map((cls, i) => `<button class="px-5 py-2.5 rounded-xl text-sm font-black transition ${i===0?'tab-active':'tab-inactive'}">${cls.split('—')[0].trim()}</button>`).join('')}
        </div>

        <div class="glass p-6 rounded-2xl">
          <table class="w-full">
            <thead class="text-[10px] text-gray-400 uppercase tracking-widest border-b border-white/10">
              <tr><th class="pb-4 text-left">Élève</th><th class="pb-4 text-center">Présent</th><th class="pb-4 text-center">Absent</th><th class="pb-4 text-center">Retard</th><th class="pb-4 text-left">Note</th></tr>
            </thead>
            <tbody class="divide-y divide-white/5">
              ${mockEleves.length > 0 ? mockEleves.map(e => `
                <div class="flex items-center justify-between p-3 rounded-xl bg-white/5 border border-white/5">
                  <span class="font-bold text-sm">${e.nom}</span>
                  <div class="flex gap-2">
                    <button class="px-3 py-1 rounded-lg text-xs font-bold ${e.statut==='present'?'bg-green-500 text-black':'bg-white/10 text-gray-400'}">P</button>
                    <button class="px-3 py-1 rounded-lg text-xs font-bold ${e.statut==='retard'?'bg-amber-500 text-black':'bg-white/10 text-gray-400'}">R</button>
                    <button class="px-3 py-1 rounded-lg text-xs font-bold ${e.statut==='absent'?'bg-red-500 text-white':'bg-white/10 text-gray-400'}">A</button>
                  </div>
                </div>
              `).join('') : '<p class="text-xs text-gray-400 italic p-4 text-center">Aucun élève inscrit dans cette classe pour le moment. En attente des inscriptions officielles.</p>'}
            </tbody>
          </table>
        </div>`;
    }

    function viewCahier() {
      return `
        <div class="mb-8 flex items-end justify-between">
          <div>
            <h2 class="text-3xl font-black uppercase tracking-tighter">Cahier de Texte</h2>
            <p class="text-xs text-gray-400 font-bold mt-1 uppercase tracking-widest">Devoirs, leçons et ressources envoyés aux parents</p>
          </div>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
          <!-- Form -->
          <div class="lg:col-span-2 glass p-6 rounded-2xl space-y-4">
            <h3 class="font-black uppercase tracking-wider text-sm mb-4">Nouveau Devoir / Leçon</h3>
            <div>
              <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1.5">Classe cible</label>
              <select class="w-full px-4 py-3 bg-[#112240]/80/5 border border-white/10 rounded-xl text-white outline-none focus:ring-2 focus:ring-amber-500">
                ${mockClasses.map(c => `<option>${c}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1.5">Type</label>
              <select class="w-full px-4 py-3 bg-[#112240]/80/5 border border-white/10 rounded-xl text-white outline-none focus:ring-2 focus:ring-amber-500">
                <option>Devoir à rendre</option><option>Leçon à apprendre</option><option>Exercice de préparation</option><option>Avis important</option>
              </select>
            </div>
            <div>
              <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1.5">Date limite</label>
              <input type="date" class="w-full px-4 py-3 bg-[#112240]/80/5 border border-white/10 rounded-xl text-white outline-none focus:ring-2 focus:ring-amber-500">
            </div>
            <div>
              <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1.5">Description</label>
              <textarea rows="3" placeholder="Détaillez le devoir..." class="w-full px-4 py-3 bg-[#112240]/80/5 border border-white/10 rounded-xl text-white outline-none focus:ring-2 focus:ring-amber-500 resize-none"></textarea>
            </div>
            <button onclick="alert('Devoir publié sur le portail des parents !')" class="w-full py-3 bg-amber-500 text-[#0a192f] font-black rounded-xl hover:bg-amber-400 transition flex items-center justify-center gap-2">
              <i data-lucide="send" class="w-4 h-4"></i> Publier aux Parents
            </button>
          </div>
          <!-- History -->
          <div class="lg:col-span-3 glass p-6 rounded-2xl">
            <h3 class="font-black uppercase tracking-wider text-sm mb-6">Historique des Publications</h3>
            <div class="space-y-4">
              ${[
                { type: 'Devoir', titre: 'Exercices p.45-47 — Algèbre', classe: '3ème Humanités', date: 'Il y a 1h', icon: 'book', color: 'amber' },
                { type: 'Leçon', titre: 'Chapitre 6 — Réactions chimiques', classe: '2ème Humanités', date: 'Hier', icon: 'flask-conical', color: 'blue' },
                { type: 'Devoir', titre: 'Calcul mental — Tables', classe: '1ère Primaire', date: '10 Juil.', icon: 'calculator', color: 'green' },
              ].map(d => `
                <div class="flex items-start gap-4 p-4 bg-[#112240]/80/5 rounded-xl hover:bg-[#112240]/80/8 transition">
                  <div class="p-2.5 rounded-xl bg-${d.color}-500/20 text-${d.color}-400 flex-shrink-0"><i data-lucide="${d.icon}" class="w-5 h-5"></i></div>
                  <div class="flex-1">
                    <div class="flex items-start justify-between gap-2">
                      <p class="font-bold text-sm">${d.titre}</p>
                      <span class="text-[10px] text-gray-500 whitespace-nowrap font-mono">${d.date}</span>
                    </div>
                    <p class="text-xs text-gray-400 mt-1">${d.classe} • <span class="badge-amber px-1.5 py-0.5 rounded text-[10px] font-black">${d.type}</span></p>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>`;
    }

    function viewNotes() {
      return `
        <div class="mb-8">
          <h2 class="text-3xl font-black uppercase tracking-tighter">Saisie des Notes</h2>
          <p class="text-xs text-gray-400 font-bold mt-1 uppercase tracking-widest">Entrez les résultats d'évaluations par classe</p>
        </div>
        <div class="glass p-6 rounded-2xl mb-6 flex flex-wrap gap-4 items-end">
          <div class="flex-1 min-w-40">
            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1.5">Classe</label>
            <select class="w-full px-4 py-3 bg-[#112240]/80/5 border border-white/10 rounded-xl text-white outline-none focus:ring-2 focus:ring-amber-500">
              ${mockClasses.map(c => `<option>${c}</option>`).join('')}
            </select>
          </div>
          <div class="flex-1 min-w-40">
            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1.5">Type d'évaluation</label>
            <select class="w-full px-4 py-3 bg-[#112240]/80/5 border border-white/10 rounded-xl text-white outline-none focus:ring-2 focus:ring-amber-500">
              <option>Interrogation (10 pts)</option><option>Devoir (20 pts)</option><option>Examen mi-trimestre (20 pts)</option><option>Examen final (100 pts)</option>
            </select>
          </div>
          <div class="flex-1 min-w-40">
            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1.5">Date</label>
            <input type="date" class="w-full px-4 py-3 bg-[#112240]/80/5 border border-white/10 rounded-xl text-white outline-none focus:ring-2 focus:ring-amber-500">
          </div>
        </div>
        <div class="glass p-6 rounded-2xl">
          <table class="w-full">
            <thead class="text-[10px] text-gray-400 uppercase tracking-widest border-b border-white/10">
              <tr><th class="pb-4 text-left">Élève</th><th class="pb-4 text-center">Note /20</th><th class="pb-4 text-center">Appréciation</th></tr>
            </thead>
            <tbody class="divide-y divide-white/5">
              ${mockEleves.map((e, i) => `
                <tr class="hover:bg-[#112240]/80/3 transition">
                  <td class="py-4 font-bold">${e.nom}</td>

    // ==========================================

    function viewVisio() {
      return `
        <div class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
          <div>
            <h2 class="text-3xl font-black uppercase tracking-tighter">Classe Virtuelle Live</h2>

                <div id="vc-section-container" class="hidden">
                  <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1 block">Section</label>
                  <select id="vc-section-select" class="w-full bg-white/5 text-sm text-white px-3 py-2.5 rounded-xl border border-white/10 outline-none focus:border-amber-500 focus:bg-white/10 transition-all cursor-pointer font-medium" onchange="window.vcHandleSectionChange()">
                    <option value="">Sélectionnez...</option>

                  <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1 block">Matière / Cours</label>

                    <!-- Populated by JS -->
                  </select>
                </div>

                <button onclick="window.startVirtualClass()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 text-[#0a192f] font-black px-4 py-3 rounded-xl hover:shadow-[0_0_20px_rgba(245,158,11,0.4)] transition-all flex items-center justify-center gap-2 mt-4 transform hover:scale-[1.02]">
                  <i data-lucide="play-circle" class="w-5 h-5"></i>
                  Lancer la séance
                </button>
              </div>
            </div>
            
            <!-- LISTE DES ÉLÈVES AUTORISÉS -->
            <div class="glass p-5 rounded-3xl border border-white/5 shadow-xl">
              <div class="flex items-center justify-between mb-4">
                <h3 class="font-black text-sm uppercase tracking-widest text-white/90">Auditoire</h3>
                <span id="vc-student-count" class="bg-emerald-500/20 text-emerald-400 text-[10px] px-2 py-1 rounded-md font-black border border-emerald-500/30">0 Élève(s)</span>
              </div>
              <div id="vc-students-list" class="space-y-2 max-h-[250px] overflow-y-auto pr-2">
                <div class="text-xs text-gray-500 italic text-center py-4">Sélectionnez une classe pour voir les élèves inscrits.</div>
              </div>
            </div>

            <!-- STATISTIQUES LIVE -->
            <div class="glass p-4 rounded-3xl border border-white/5">
              <div class="flex justify-between items-center text-sm mb-2">
                <span class="text-gray-400 font-medium">En ligne</span>
                <span class="font-black text-amber-400 flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span><span id="vc-participants">0</span></span>
              </div>
              <div class="flex justify-between items-center text-sm">
                <span class="text-gray-400 font-medium">Chrono</span>
                <span class="font-black text-white font-mono" id="vc-duration">00:00</span>
              </div>
            </div>
          </div>

          <!-- ÉCRAN JITSI -->
          <div class="lg:col-span-3">
            <div class="glass p-1 rounded-3xl h-[600px] border border-white/10 overflow-hidden flex flex-col relative shadow-2xl bg-black/40">
              <div id="jitsi-container" class="w-full h-full flex items-center justify-center flex-col gap-5 relative z-10">
                <div class="w-24 h-24 bg-gradient-to-br from-amber-500/10 to-amber-600/5 rounded-full flex items-center justify-center text-amber-500 border border-amber-500/20 shadow-[0_0_30px_rgba(245,158,11,0.1)]">
                  <i data-lucide="video" class="w-10 h-10 opacity-80"></i>
                </div>
                <div class="text-center">
                  <p class="text-white text-lg font-black tracking-tight mb-1">Prêt à enseigner ?</p>
                  <p class="text-gray-500 text-sm font-medium">Configurez votre classe à gauche et lancez la séance.</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    let jitsiApi = null;
    let vcTimer = null;
    let vcSeconds = 0;

    const optionsTech = ['Commerciale et Gestion', 'Secrétariat-Bureautique', 'Informatique de Gestion', 'Électricité', 'Mécanique Générale', 'Construction', 'Électronique', 'Nutrition-Alimentation', 'Puériculture', 'Coupe et Couture', 'Esthétique', 'Nursing (Soins Infirmiers)', 'Accoucheuse', 'Agriculture', 'Élevage', 'Pêche et Pisciculture'];
    const optionsNonTech = ['Math-Physique', 'Chimie-Biologie', 'Latin-Philosophie', 'Histoire-Géo-Socio-Économie', 'Pédagogie Générale'];

    window.initVirtualClassTeacher = function() {
      if (window.lucide) lucide.createIcons();
      const u = JSON.parse(localStorage.getItem('hr_user'));
      if (!u) return;

      const selClasse = document.getElementById('vc-classe-select');
      const selCours = document.getElementById('vc-cours-select');
      if (!selClasse || !selCours) return;

      // Setup Classes
      selClasse.innerHTML = '<option value="">Sélectionnez une classe...</option>';
      let classes = [];
      if (u.ecole === 'Harmonie') {
        classes = ['1ère Maternelle', '2ème Maternelle', '3ème Maternelle', '1ère Primaire', '2ème Primaire', '3ème Primaire', '4ème Primaire', '5ème Primaire', '6ème Primaire'];
      } else {
        classes = ['7ème CTEB', '8ème CTEB', '1ère Humanités', '2ème Humanités', '3ème Humanités', '4ème Humanités'];
      }
      classes.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        selClasse.appendChild(opt);
      });

      // Setup Cours
      selCours.innerHTML = '';
      if (u.courses && u.courses.trim().length > 0) {
        const cList = u.courses.split(',').map(c => c.trim()).filter(c => c);
        cList.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c;
          opt.textContent = c;
          selCours.appendChild(opt);
        });
      } else {
        const opt = document.createElement('option');
        opt.value = "Cours Principal";
        opt.textContent = "Cours Principal";
        selCours.appendChild(opt);
      }
    };

    window.vcHandleClasseChange = function() {
      const u = JSON.parse(localStorage.getItem('hr_user'));
      const classe = document.getElementById('vc-classe-select').value;
      const secContainer = document.getElementById('vc-section-container');
      const optContainer = document.getElementById('vc-option-container');
      
      // Reset
      secContainer.classList.add('hidden');
      optContainer.classList.add('hidden');
      document.getElementById('vc-section-select').value = '';
      document.getElementById('vc-option-select').innerHTML = '';

      if (u.ecole === 'Retrouvailles' && classe.includes('Humanités')) {
        secContainer.classList.remove('hidden');
      }

      window.vcUpdateStudentList();
    };

    window.vcHandleSectionChange = function() {
      const section = document.getElementById('vc-section-select').value;
      const optContainer = document.getElementById('vc-option-container');
      const optSelect = document.getElementById('vc-option-select');
      
      optSelect.innerHTML = '<option value="">Sélectionnez une option...</option>';
      
      if (!section) {
        optContainer.classList.add('hidden');
      } else {
        optContainer.classList.remove('hidden');
        const optionsList = section === 'Technique' ? optionsTech : optionsNonTech;
        optionsList.forEach(o => {
          const opt = document.createElement('option');
          opt.value = o;
          opt.textContent = o;
          optSelect.appendChild(opt);
        });
      }
      
      window.vcUpdateStudentList();
    };

    window.vcHandleOptionChange = function() {
      window.vcUpdateStudentList();
    };

    window.vcUpdateStudentList = function() {
      const u = JSON.parse(localStorage.getItem('hr_user'));
      const classe = document.getElementById('vc-classe-select').value;
      const section = document.getElementById('vc-section-select').value;
      const option = document.getElementById('vc-option-select').value;
      
      const listEl = document.getElementById('vc-students-list');
      const countEl = document.getElementById('vc-student-count');
      
      if (!classe) {
        listEl.innerHTML = '<div class="text-xs text-gray-500 italic text-center py-4">Sélectionnez une classe pour voir les élèves.</div>';
        countEl.textContent = '0 Élève(s)';
        return;
      }

      // Logic pour Retrouvailles: si Humanité, on attend section & option
      if (u.ecole === 'Retrouvailles' && classe.includes('Humanités')) {
        if (!section || !option) {
          listEl.innerHTML = '<div class="text-xs text-amber-500/70 italic text-center py-4">Veuillez spécifier la section et l\'option.</div>';
          countEl.textContent = '0 Élève(s)';
          return;
        }
      }

      // Fetch students from DB
      const db = JSON.parse(localStorage.getItem('hr_users_db_v2')) || [];
      // Parents store their children in 'enfants' array. We must find all students that match.
      let enrolled = [];
      db.forEach(user => {
        if (user.role === 'Parent' && Array.isArray(user.enfants)) {
          user.enfants.forEach(enfant => {
            if (enfant.ecole === u.ecole && enfant.classe === classe) {
              if (u.ecole === 'Retrouvailles' && classe.includes('Humanités')) {
                if (enfant.section === section && enfant.option === option) {
                  enrolled.push({ ...enfant, parent: user.nom });
                }
              } else {
                enrolled.push({ ...enfant, parent: user.nom });
              }
            }
          });
        }
      });

      countEl.textContent = `${enrolled.length} Élève(s)`;

      if (enrolled.length === 0) {
        listEl.innerHTML = '<div class="text-xs text-gray-500 italic text-center py-4">Aucun élève inscrit dans cette configuration.</div>';
      } else {
        listEl.innerHTML = enrolled.map(e => `
          <div class="flex items-center gap-3 p-2 rounded-xl hover:bg-white/5 transition border border-transparent hover:border-white/10 group">
            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-emerald-500/20 to-emerald-600/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-black text-xs shrink-0">
              ${(e.prenom?.[0]||'')}${(e.nom?.[0]||'')}
            </div>
            <div class="min-w-0 flex-1">
              <p class="text-sm font-bold text-white truncate">${e.prenom} ${e.nom}</p>
            </div>
            <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-500/50 group-hover:text-emerald-400 transition"></i>
          </div>
        `).join('');
        if (window.lucide) lucide.createIcons();
      }
    };

    window.startVirtualClass = function() {
      const u = JSON.parse(localStorage.getItem('hr_user'));
      const classe = document.getElementById('vc-classe-select').value;
      const section = document.getElementById('vc-section-select').value;
      const option = document.getElementById('vc-option-select').value;
      const cours = document.getElementById('vc-cours-select').value;
      const container = document.getElementById('jitsi-container');
      
      if (!classe || !cours) {
        alert("Veuillez sélectionner une classe et saisir la matière.");
        return;
      }

      if (u.ecole === 'Retrouvailles' && classe.includes('Humanités') && (!section || !option)) {
        alert("Veuillez sélectionner la section et l'option pour les Humanités.");
        return;
      }
      
      container.innerHTML = ''; // Clear placeholder
      
      const teacherName = document.getElementById('teacher-name').textContent || 'Enseignant';
      const domain = 'meet.jit.si';
      
      let roomTarget = `${classe}`;
      if (section && option) roomTarget += `-${section}-${option}`;
      
      const roomName = `HR-${u.ecole}-${roomTarget.replace(/[^a-zA-Z0-9]/g, '')}-${Date.now()}`;
      
      const optionsConfig = {
        roomName: roomName,
        width: '100%',
        height: '100%',
        parentNode: container,
        userInfo: {
          displayName: teacherName
        },
        configOverwrite: { 
          startWithAudioMuted: false,
          startWithVideoMuted: false,
          prejoinPageEnabled: false
        },
        interfaceConfigOverwrite: {
          TOOLBAR_BUTTONS: ['microphone', 'camera', 'desktop', 'chat', 'raisehand', 'participants', 'tileview', 'hangup']
        }
      };
      
      try {
        jitsiApi = new window.JitsiMeetExternalAPI(domain, optionsConfig);
        
        jitsiApi.addEventListener('participantJoined', (participant) => {
          updateParticipantsCount();
        });
        
        jitsiApi.addEventListener('participantLeft', (participant) => {
          updateParticipantsCount();
        });
        
        jitsiApi.addEventListener('videoConferenceLeft', () => {
          endVirtualClass();
        });

        // Start timer
        vcSeconds = 0;
        clearInterval(vcTimer);
        vcTimer = setInterval(() => {
          vcSeconds++;
          const m = Math.floor(vcSeconds / 60).toString().padStart(2, '0');
          const s = (vcSeconds % 60).toString().padStart(2, '0');
          const el = document.getElementById('vc-duration');
          if (el) el.textContent = `${m}:${s}`;
        }, 1000);

        // Register in global virtual classes API so parents and admin can see it in real-time
        try {
          fetch('/api/visio', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              room_name: roomName,
              titre: `${cours} (${classe})`,
              initiateur: `${teacherName} (Enseignant)`,
              cibles: classe
            })
          });
        } catch (e) {
          console.error("Erreur API visio teacher:", e);
        }

      } catch (err) {
        console.error("Erreur d'initialisation Jitsi :", err);
        container.innerHTML = '<div class="text-red-400 p-4 bg-red-500/10 rounded-xl">Impossible de charger le module de visio.</div>';
      }
    };

    function updateParticipantsCount() {
      if (!jitsiApi) return;
      const count = jitsiApi.getNumberOfParticipants();
      const el = document.getElementById('vc-participants');
      if (el) el.textContent = count;
    }

    function endVirtualClass() {
      if (jitsiApi) {
        jitsiApi.dispose();
        jitsiApi = null;
      }
      clearInterval(vcTimer);
      showView('visio'); // Reset view
    }

    // Init — Affichage nom & rôle réel
    const userInit = JSON.parse(localStorage.getItem('hr_user'));
    if (!userInit) {
      window.location.href = '/login.html';
    } else if (userInit.role === 'Parent') {
      alert("⛔ ACCÈS REFUSÉ — SÉCURITÉ EPST\n\nUn compte parent ne peut pas accéder à l'Espace Enseignant.");
      window.location.href = '/parent-dashboard.html';
    } else {
      const elName   = document.getElementById('teacher-name');
      const elRole   = document.getElementById('teacher-role');
      const elAvatar = document.getElementById('teacher-avatar');
      const fullName = [userInit.prenom, userInit.nom].filter(Boolean).join(' ');
      if (elName)   elName.textContent   = fullName || 'Inconnu';
      if (elRole)   elRole.textContent   = userInit.role || 'Agent';
      if (elAvatar) elAvatar.textContent = (((userInit.prenom || '')[0]) + ((userInit.nom || '')[0])).toUpperCase() || '?';
    }

    showView('accueil');
  </script>
</body>
