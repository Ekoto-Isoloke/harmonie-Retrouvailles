<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Espace Enseignant | Harmonie-Retrouvailles</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #0a192f; }
    .font-display { font-family: 'Playfair Display', serif; }
    .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
    .glass-light { background: rgba(255,255,255,0.07); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    .sidebar-link { display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;color:rgba(255,255,255,0.6);transition:all .2s;cursor:pointer; }
    .sidebar-link:hover, .sidebar-link.active { background:rgba(255,255,255,0.08);color:#fff; }
    .sidebar-link.active { border-left: 3px solid #f59e0b; padding-left: 13px; }
    .tab-active { background: #f59e0b; color: #0a192f; }
    .tab-inactive { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.6); }
    .badge-green { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.25); }
    .badge-red { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.25); }
    .badge-amber { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.25); }
    .badge-blue { background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.25); }
    .badge-purple { background: rgba(168,85,247,0.15); color: #c084fc; border: 1px solid rgba(168,85,247,0.25); }
    .kpi-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 24px; transition: all .3s; }
    .kpi-card:hover { background: rgba(255,255,255,0.08); transform: translateY(-2px); }
    .week-row:hover td { background: rgba(245,158,11,0.05); }
    .week-row td { transition: background 0.15s; }
    .prog-bar { height: 6px; background: rgba(255,255,255,0.08); border-radius: 9999px; overflow: hidden; }
    .prog-fill { height: 100%; border-radius: 9999px; background: linear-gradient(90deg, #f59e0b, #10b981); transition: width 0.5s; }
    input[type=text], input[type=number], input[type=date], textarea, select {
      background: rgba(17,34,64,0.6); border: 1px solid rgba(255,255,255,0.1); color: #fff;
      border-radius: 12px; padding: 10px 14px; font-size: 13px; outline: none; transition: border 0.2s;
    }
    input:focus, textarea:focus, select:focus { border-color: #f59e0b; box-shadow: 0 0 0 2px rgba(245,158,11,0.15); }
    select option { background: #112240; color: #fff; }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
    @media print {
      aside, .no-print { display: none !important; }
      main { margin: 0 !important; padding: 0 !important; }
      body { background: #fff !important; color: #000 !important; }
    }
  </style>
</head>
<body class="text-white min-h-screen flex flex-col md:flex-row overflow-x-hidden">

  <!-- SIDEBAR -->
  <aside class="w-full md:w-64 md:min-h-screen glass flex flex-col py-6 px-4 shrink-0 md:fixed md:left-0 md:top-0 md:bottom-0 z-40 overflow-y-auto">
    <div class="flex items-center gap-3 px-2 mb-8">
      <div class="w-12 h-12 rounded-full overflow-hidden bg-white p-0.5 shadow-lg border border-white/20 shrink-0">
        <img id="teacher-school-logo" src="/logos/logo-harmonie.jpg" alt="Logo École" class="w-full h-full object-contain rounded-full">
      </div>
      <div>
        <p class="font-black text-sm leading-tight uppercase" id="teacher-portal-title">Espace Enseignant</p>
        <p class="text-amber-400 text-[11px] font-bold" id="teacher-inst-badge">C.S. Harmonie</p>
      </div>
    </div>
    <nav class="space-y-1 flex-1">
      <div class="sidebar-link active" onclick="showView('accueil')">
        <i data-lucide="layout-dashboard" class="w-5 h-5 shrink-0"></i> Vue d'ensemble
      </div>
      <div class="sidebar-link" onclick="showView('presences')">
        <i data-lucide="user-check" class="w-5 h-5 shrink-0"></i> Présences Élèves
      </div>
      <div class="sidebar-link" onclick="showView('prevision')">
        <i data-lucide="map" class="w-5 h-5 shrink-0"></i> Prévision de Matières
        <span class="ml-auto bg-amber-500/20 text-amber-400 text-[9px] font-black px-1.5 py-0.5 rounded-full border border-amber-500/30">NEW</span>
      </div>
      <div class="sidebar-link" onclick="showView('notes')">
        <i data-lucide="bar-chart-2" class="w-5 h-5 shrink-0"></i> Cotation des Élèves
      </div>
      <div class="sidebar-link" onclick="showView('cahier')">
        <i data-lucide="book-open" class="w-5 h-5 shrink-0"></i> Cahier de Texte
      </div>
      <div class="sidebar-link" onclick="showView('planning')">
        <i data-lucide="calendar" class="w-5 h-5 shrink-0"></i> Mon Planning
      </div>
      <div class="sidebar-link" onclick="showView('messagerie')">
        <i data-lucide="message-circle" class="w-5 h-5 shrink-0"></i> Messagerie Direction
        <span class="ml-auto bg-red-500 text-white text-[10px] font-black px-2 py-0.5 rounded-full">2</span>
      </div>
    </nav>
    <div class="mt-auto pt-4 border-t border-white/10">
      <div class="glass-light p-4 rounded-2xl mb-3">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-amber-500/20 border border-amber-500/30 flex items-center justify-center text-amber-400 font-black text-sm" id="teacher-avatar">--</div>
          <div>
            <p class="font-bold text-sm" id="teacher-name">---</p>
            <p class="text-[11px] text-gray-400" id="teacher-role">Enseignant</p>
          </div>
        </div>
      </div>
      <button onclick="localStorage.removeItem('hr_user'); localStorage.removeItem('hr_token'); window.location.href='/login.html'" class="w-full flex items-center gap-2 px-4 py-2.5 rounded-xl text-red-400 hover:bg-red-500/10 transition text-sm font-bold">
        <i data-lucide="log-out" class="w-4 h-4"></i> Déconnexion
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="md:ml-64 flex-1 p-4 md:p-8" id="main-content"></main>

  <script>
    const userStr = localStorage.getItem('hr_user');
    if (!userStr) { window.location.href = '/login.html'; throw new Error('Non connecté'); }
    const user = JSON.parse(userStr);
    if (!user) { window.location.href = '/login.html'; throw new Error('Session invalide'); }
    if (user.role === 'Parent') {
      alert("⛔ ACCÈS REFUSÉ\\nUn compte parent ne peut pas accéder à l'Espace Enseignant.");
      window.location.href = '/parent-dashboard.html';
      throw new Error('Accès refusé');
    }

    const fullName = [user.prenom, user.nom].filter(Boolean).join(' ');
    const teacherSchool = user.ecole || 'Harmonie';
    document.getElementById('teacher-name').textContent = fullName || 'Inconnu';
    document.getElementById('teacher-role').textContent = `${user.role || 'Agent'} — ${teacherSchool === 'Harmonie' ? 'C.S. Harmonie' : 'G.S. Retrouvailles'}`;
    const initials = ((user.prenom || '')[0] || '') + ((user.nom || '')[0] || '');
    document.getElementById('teacher-avatar').textContent = initials.toUpperCase() || '?';
    const teacherLogoEl = document.getElementById('teacher-school-logo');
    if (teacherLogoEl) teacherLogoEl.src = teacherSchool === 'Harmonie' ? '/logos/logo-harmonie.jpg' : '/logos/logo-retrouvailles.jpg';
    const teacherBadgeEl = document.getElementById('teacher-inst-badge');
    if (teacherBadgeEl) teacherBadgeEl.textContent = teacherSchool === 'Harmonie' ? 'C.S. Harmonie' : 'G.S. Retrouvailles';

    // ── Charger les affectations RÉELLES faites par le D.E (Secondaire) ou Sur École (Primaire) ──
    const affectationsRetr = JSON.parse(localStorage.getItem('hr_affectations_db')) || [];
    const myAffs = affectationsRetr.filter(a => a.teacherEmail === user.email || (user.nom && a.teacherName && a.teacherName.includes(user.nom)));
    
    const titularitesHarm = JSON.parse(localStorage.getItem('hr_titularites_primaire_db')) || [];
    const myTit = titularitesHarm.find(t => t.teacherEmail === user.email || (user.nom && t.teacherName && t.teacherName.includes(user.nom)));

    const assignedClasses = myAffs.length > 0
      ? myAffs.map(a => `${a.classe} (${a.course})`)
      : (myTit ? [myTit.classe] : (user.assignedClasses || []));

    const userCourses = Array.isArray(user.courses) ? user.courses : (user.courses ? user.courses.split(',').map(c => c.trim()).filter(Boolean) : []);
    
    const teacherClasses = assignedClasses.length > 0
      ? assignedClasses
      : (userCourses.length > 0 ? userCourses : (user.classes && user.classes.length > 0 ? user.classes : ['Non affecté']));

    // ── Charger les VRAIS élèves depuis hr_eleves_db (filtrés par institution) ──
    function getElevesForInstitution() {
      const allEleves = JSON.parse(localStorage.getItem('hr_eleves_db')) || [];
      return allEleves.filter(e => e.ecole === user.ecole && e.statut !== 'Rejeté');
    }
    
    function getElevesList() {
      const eleves = getElevesForInstitution();
      if (eleves.length > 0) {
        return eleves.map(e => ({
          nom: [e.nom, e.postnom, e.prenom].filter(Boolean).join(' ').toUpperCase(),
          classe: e.classe || '',
          section: e.section || '',
          option: e.option || '',
          statut: 'present',
          matricule: e.matricule || '',
          paye: e.paye || 0
        }));
      }
      // Fallback mock si aucun élève inscrit
      return [
        { nom: 'MUKENDI KABUYA', statut: 'present', classe: '', section: '', option: '' },
        { nom: 'BAYA PAUL JR', statut: 'absent', classe: '', section: '', option: '' },
        { nom: 'TSHILANDA ALICE', statut: 'present', classe: '', section: '', option: '' },
        { nom: 'KABONGO MERVEILLE', statut: 'retard', classe: '', section: '', option: '' },
        { nom: 'LEKI MARC', statut: 'present', classe: '', section: '', option: '' },
        { nom: 'ILUNGA CHRISTIAN', statut: 'present', classe: '', section: '', option: '' },
        { nom: 'MBUYI RACHEL', statut: 'present', classe: '', section: '', option: '' },
      ];
    }
    const mockEleves = getElevesList();
    
    // ── Rôle : Déterminer les fonctions disponibles ──
    const isEnseignant = ['Enseignant', 'Sur École'].includes(user.role);
    const isPrefetDE = ['Préfet', 'D.E', 'D.D'].includes(user.role);
    const isDirecteur = ['Directeur (D.P)', 'Direction', 'D.P'].includes(user.role);

    // Storage helpers
    function savePrevision(data) { localStorage.setItem('prevision_' + (user.login || user.nom || 'e'), JSON.stringify(data)); }
    function loadPrevision() { const d = localStorage.getItem('prevision_' + (user.login || user.nom || 'e')); return d ? JSON.parse(d) : {}; }
    function getPrevisionMeta() { const d = localStorage.getItem('prevision_meta_' + (user.login || user.nom || 'e')); return d ? JSON.parse(d) : { matiere:'', classe:teacherClasses[0]||'', volumeHoraire:'', soumis:false, dateSoumission:null, statut:'brouillon' }; }
    function savePrevisionMeta(m) { localStorage.setItem('prevision_meta_' + (user.login || user.nom || 'e'), JSON.stringify(m)); }
    function saveCotations(data) { localStorage.setItem('cotations_' + (user.login || user.nom || 'e'), JSON.stringify(data)); }
    function loadCotations() { const d = localStorage.getItem('cotations_' + (user.login || user.nom || 'e')); return d ? JSON.parse(d) : {}; }

    function setActiveLink(viewName) {
      document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
      const links = document.querySelectorAll('.sidebar-link');
      const map = { accueil:0, presences:1, prevision:2, notes:3, cahier:4, planning:5, messagerie:6 };
      if (links[map[viewName]]) links[map[viewName]].classList.add('active');
    }

    function showView(name) {
      setActiveLink(name);
      const c = document.getElementById('main-content');
      switch(name) {
        case 'accueil': c.innerHTML = viewAccueil(); break;
        case 'presences': c.innerHTML = viewPresences(); break;
        case 'prevision': c.innerHTML = viewPrevision(); break;
        case 'notes': c.innerHTML = viewNotes(); break;
        case 'cahier': c.innerHTML = viewCahier(); break;
        case 'planning': c.innerHTML = viewPlanning(); break;
        case 'messagerie': c.innerHTML = viewMessagerie(); break;
      }
      if (window.lucide) lucide.createIcons();
    }

    // ===== VUE D'ENSEMBLE =====
    function viewAccueil() {
      const meta = getPrevisionMeta();
      const prev = loadPrevision();
      const totalWeeks = 42;
      const filledWeeks = Object.keys(prev).filter(k => k.endsWith('_chapitres') && prev[k] && prev[k].trim()).length;
      const progPct = Math.round((filledWeeks / totalWeeks) * 100);
      const statutLabel = meta.statut === 'approuve' ? '✓ Approuvée' : meta.statut === 'rejete' ? '✗ Rejetée' : meta.statut === 'soumis' ? '⏳ En attente' : 'Brouillon';
      const statutColor = meta.statut === 'approuve' ? 'badge-green' : meta.statut === 'rejete' ? 'badge-red' : meta.statut === 'soumis' ? 'badge-blue' : 'badge-amber';

      const totalHeures = myAffs.reduce((sum, a) => sum + (parseInt(a.weeklyHours) || 0), 0) || (myTit ? myTit.weeklyHours : (user.ecole === 'Harmonie' ? 28 : 18));

      return `
        <div class="mb-8">
          <h2 class="text-3xl font-black uppercase tracking-tighter">Bonjour, ${user.prenom || fullName} 👋</h2>
          <p class="text-xs text-gray-400 font-bold mt-1 uppercase tracking-widest">${new Date().toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'})}</p>
        </div>
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
          <div class="kpi-card cursor-pointer hover:border-purple-500/40" onclick="showView('planning')">
            <div class="w-10 h-10 rounded-xl bg-purple-500/20 flex items-center justify-center mb-3"><i data-lucide="clock" class="w-5 h-5 text-purple-400"></i></div>
            <div class="text-2xl font-black font-mono text-purple-300">${totalHeures}<span class="text-xs font-normal text-gray-400 font-sans">h / sem.</span></div>
            <div class="text-xs text-gray-400 uppercase tracking-widest mt-1">Charge Horaire EPST</div>
          </div>
          <div class="kpi-card">
            <div class="w-10 h-10 rounded-xl bg-blue-500/20 flex items-center justify-center mb-3"><i data-lucide="users" class="w-5 h-5 text-blue-400"></i></div>
            <div class="text-2xl font-black">${teacherClasses.length}</div>
            <div class="text-xs text-gray-400 uppercase tracking-widest mt-1">Classes affectées</div>
          </div>
          <div class="kpi-card cursor-pointer hover:border-amber-500/40" onclick="showView('prevision')">
            <div class="w-10 h-10 rounded-xl bg-amber-500/20 flex items-center justify-center mb-3"><i data-lucide="map" class="w-5 h-5 text-amber-400"></i></div>
            <div class="text-2xl font-black">${progPct}<span class="text-sm font-normal text-gray-400">%</span></div>
            <div class="text-xs text-gray-400 uppercase tracking-widest mt-1">Programme rempli</div>
            <div class="prog-bar mt-3"><div class="prog-fill" style="width:${progPct}%"></div></div>
          </div>
          <div class="kpi-card">
            <div class="w-10 h-10 rounded-xl bg-emerald-500/20 flex items-center justify-center mb-3"><i data-lucide="user-check" class="w-5 h-5 text-green-400"></i></div>
            <div class="text-2xl font-black">94<span class="text-sm font-normal text-gray-400">%</span></div>
            <div class="text-xs text-gray-400 uppercase tracking-widest mt-1">Présence & Assiduité</div>
          </div>
        </div>
        ${!meta.soumis ? `
        <div class="p-4 bg-amber-500/10 border border-amber-500/30 rounded-2xl flex items-center justify-between gap-4 mb-8">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-amber-500/20 rounded-xl flex items-center justify-center shrink-0"><i data-lucide="alert-triangle" class="w-5 h-5 text-amber-400"></i></div>
            <div>
              <p class="font-black text-sm text-amber-400 uppercase tracking-wide">Prévision de Matières non soumise</p>
              <p class="text-xs text-gray-300 mt-0.5">Veuillez remplir et soumettre votre canevas de prévision 2026-2027.</p>
            </div>
          </div>
          <button onclick="showView('prevision')" class="px-4 py-2.5 bg-amber-500 text-gray-950 font-black rounded-xl text-xs shrink-0 hover:bg-amber-400 transition flex items-center gap-2">
            <i data-lucide="map" class="w-4 h-4"></i> Remplir
          </button>
        </div>
        ` : `
        <div class="p-4 bg-emerald-500/10 border border-emerald-500/30 rounded-2xl flex items-center justify-between gap-4 mb-8">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-emerald-500/20 rounded-xl flex items-center justify-center shrink-0"><i data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i></div>
            <div>
              <p class="font-black text-sm text-emerald-400 uppercase tracking-wide">Prévision soumise</p>
              <p class="text-xs text-gray-300 mt-0.5">Statut : <span class="font-bold px-2 py-0.5 rounded-full ${statutColor}">${statutLabel}</span></p>
            </div>
          </div>
          <button onclick="showView('prevision')" class="px-4 py-2.5 bg-white/10 text-white font-bold rounded-xl text-xs shrink-0 hover:bg-white/20 transition flex items-center gap-2">
            <i data-lucide="eye" class="w-4 h-4"></i> Consulter
          </button>
        </div>
        `}
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div class="glass p-6 rounded-2xl border border-purple-500/20">
            <div class="flex items-center justify-between mb-4">
              <h3 class="font-black text-base uppercase tracking-wider flex items-center gap-2 text-purple-300">
                <i data-lucide="clock" class="w-5 h-5 text-purple-400"></i> Charge Horaire par Classe
              </h3>
              <span class="px-2.5 py-1 rounded-full bg-purple-500/20 text-purple-300 font-mono font-black text-xs">Total : ${totalHeures}h / sem</span>
            </div>
            <div class="space-y-3">
              ${myAffs.length > 0 ? myAffs.map(a => `
                <div class="p-3.5 bg-white/5 border border-white/5 rounded-xl flex items-center justify-between hover:bg-white/10 transition cursor-pointer" onclick="showView('planning')">
                  <div>
                    <p class="font-black text-sm text-white">${a.classe}</p>
                    <p class="text-xs text-purple-300 mt-0.5">${a.course} • <span class="text-gray-400 font-mono">${a.day} (${a.timeSlot})</span></p>
                  </div>
                  <div class="text-right">
                    <span class="px-2.5 py-1 rounded-lg bg-emerald-500/20 text-emerald-400 font-mono font-black text-xs border border-emerald-500/30">${a.weeklyHours}h / sem</span>
                  </div>
                </div>
              `).join('') : (myTit ? `
                <div class="p-3.5 bg-emerald-500/10 border border-emerald-500/20 rounded-xl flex items-center justify-between">
                  <div>
                    <p class="font-black text-sm text-white">${myTit.classe}</p>
                    <p class="text-xs text-emerald-300 mt-0.5">Classe Titulaire • ${myTit.schedule}</p>
                  </div>
                  <span class="px-2.5 py-1 rounded-lg bg-emerald-500/20 text-emerald-400 font-mono font-black text-xs">${myTit.weeklyHours}h / sem</span>
                </div>
              ` : `
                <div class="p-4 bg-white/5 rounded-xl text-center text-xs text-gray-400 italic">
                  Aucune affectation de classe active pour le moment.
                </div>
              `)}
            </div>
          </div>
          <div class="glass p-6 rounded-2xl border border-white/10">
            <h3 class="font-black text-base uppercase tracking-wider mb-4 flex items-center gap-2"><i data-lucide="calendar" class="w-5 h-5 text-blue-400"></i> Prochains Cours</h3>
            <div class="space-y-3">
              ${myAffs.length > 0 ? myAffs.slice(0, 3).map(a => `
                <div class="flex items-center gap-3 p-3 bg-white/5 rounded-xl">
                  <div class="text-xs font-mono text-gray-400 w-28 shrink-0">${a.timeSlot.split('(')[0]}</div>
                  <div class="flex-1"><p class="font-bold text-sm text-white">${a.classe}</p><p class="text-[11px] text-gray-400">${a.course} • ${a.day}</p></div>
                  <span class="px-2 py-1 rounded-full text-[10px] font-black uppercase badge-purple">${a.weeklyHours}h</span>
                </div>
              `).join('') : `
                <div class="p-4 text-center text-xs text-gray-400">
                  Consultez votre emploi du temps dans l'onglet Planning.
                </div>
              `}
            </div>
          </div>
        </div>`;
    }

    // ===== PRÉSENCES =====
    function viewPresences() {
      return `
        <div class="mb-8 flex items-end justify-between">
          <div>
            <h2 class="text-3xl font-black uppercase tracking-tighter">Présences Élèves</h2>
            <p class="text-xs text-gray-400 font-bold mt-1 uppercase tracking-widest">Pointage journalier par classe</p>
          </div>
          <button onclick="alert('Présences enregistrées !')" class="px-6 py-3 bg-amber-500 text-[#0a192f] font-black rounded-xl hover:bg-amber-400 transition shadow-lg flex items-center gap-2">
            <i data-lucide="save" class="w-4 h-4"></i> Enregistrer
          </button>
        </div>
        <div class="glass p-2 rounded-2xl flex flex-wrap gap-2 mb-6 w-fit">
          ${teacherClasses.map((cls, i) => `<button class="px-5 py-2.5 rounded-xl text-sm font-black transition ${i===0?'tab-active':'tab-inactive'}">${cls.split('—')[0].trim()}</button>`).join('')}
        </div>
        <div class="glass p-6 rounded-2xl overflow-x-auto">
          <table class="w-full min-w-[600px]">

    function getCote(pct) {
      if (pct >= 80) return {label:'Très Bien',css:'badge-green',icon:'🏆'};
      if (pct >= 70) return {label:'Bien',css:'badge-green',icon:'👍'};
      if (pct >= 60) return {label:'Satisfaisant',css:'badge-amber',icon:'✅'};
      if (pct >= 50) return {label:'Passable',css:'badge-amber',icon:'⚠️'};
      return {label:'Insuffisant',css:'badge-red',icon:'❌'};
    }

    window.updateCote = function(nom, type, val) {
      const cot = loadCotations();
      if (!cot[nom]) cot[nom] = {};
      cot[nom][type] = parseFloat(val) || 0;
      saveCotations(cot);
      const r = cot[nom];
      const total = Math.round((((r.interro1||0)+(r.interro2||0))/20*20 + ((r.devoir1||0)+(r.devoir2||0))/40*20 + (r.exam1||0)/30*30 + (r.exam2||0)/30*30) / 90 * 100);
      const k = nom.replace(/\\s/g,'_');
      const tEl = document.getElementById('total_'+k);
      const mEl = document.getElementById('mention_'+k);
      if (tEl) { tEl.textContent = total+'%'; tEl.className = 'text-lg font-black '+(total>=60?'text-emerald-400':total>=50?'text-amber-400':'text-rose-400'); }
      if (mEl) { const c = getCote(total); mEl.textContent = c.icon+' '+c.label; mEl.className = 'px-3 py-1 rounded-full text-xs font-black '+c.css; }
    };

              <div class="flex items-center gap-3 p-3 ${i===0?'bg-amber-500/10 border border-amber-500/20':'bg-white/5'} rounded-xl cursor-pointer hover:bg-white/10 transition">
                <div class="w-10 h-10 rounded-xl bg-${c.color}-500/20 border border-${c.color}-500/30 flex items-center justify-center text-${c.color}-400 font-black text-sm shrink-0">${c.nom[0]}</div>
                <div class="flex-1 min-w-0"><div class="flex justify-between items-center"><p class="font-bold text-sm">${c.nom}</p><span class="text-[10px] text-gray-500">${c.heure}</span></div><p class="text-xs text-gray-400 truncate">${c.msg}</p></div>
                ${c.unread?'<span class="w-5 h-5 bg-red-500 text-white rounded-full text-[10px] font-black flex items-center justify-center shrink-0">'+c.unread+'</span>':''}
              </div>`).join('')}
          </div>
          <div class="lg:col-span-2 glass p-4 rounded-2xl flex flex-col">
            <div class="border-b border-white/10 pb-4 mb-4 flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-amber-500/20 flex items-center justify-center text-amber-400 font-black">D</div>
              <div><p class="font-bold">Direction Générale</p><p class="text-xs text-green-400">● En ligne</p></div>
            </div>
            <div class="flex-1 overflow-y-auto space-y-4 mb-4">
              <div class="flex justify-end"><div class="bg-amber-500/20 border border-amber-500/20 rounded-2xl rounded-tr-sm px-4 py-3 max-w-xs"><p class="text-sm">Bonjour, j'ai soumis le rapport de présences du jour.</p><p class="text-[10px] text-gray-500 mt-1 text-right">08:30</p></div></div>
              <div class="flex justify-start"><div class="bg-white/8 rounded-2xl rounded-tl-sm px-4 py-3 max-w-xs"><p class="text-sm">Votre rapport est bien reçu. Merci pour la ponctualité.</p><p class="text-[10px] text-gray-500 mt-1">09:14</p></div></div>
            </div>
            <div class="flex gap-3">
              <input type="text" placeholder="Votre message..." class="flex-1">
              <button onclick="alert('Message envoyé !')" class="px-5 py-3 bg-amber-500 text-[#0a192f] font-black rounded-xl hover:bg-amber-400 transition"><i data-lucide="send" class="w-4 h-4"></i></button>
            </div>
          </div>
        </div>`;
    }

    showView('accueil');
  </script>
</body>
</html>
