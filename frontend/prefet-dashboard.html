<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Direction & Discipline | Harmonie-Retrouvailles</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://meet.jit.si/external_api.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #0a192f; }
    .font-display { font-family: 'Playfair Display', serif; }
    .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
    .glass-light { background: rgba(255,255,255,0.07); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    .sidebar-link { display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;color:rgba(255,255,255,0.6);transition:all .2s;cursor:pointer; }
    .sidebar-link:hover, .sidebar-link.active { background:rgba(255,255,255,0.08);color:#fff; }
    .sidebar-link.active { border-left: 3px solid #8b5cf6; padding-left: 13px; }
    .kpi-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 24px; transition: all .3s; }
    .kpi-card:hover { background: rgba(255,255,255,0.08); transform: translateY(-2px); }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
  </style>
</head>
<body class="text-white min-h-screen flex flex-col md:flex-row overflow-x-hidden">

  <!-- SIDEBAR -->
  <aside class="w-full md:w-64 md:min-h-screen glass flex flex-col py-6 px-4 shrink-0 md:fixed md:left-0 md:top-0 md:bottom-0 z-40">
    <!-- Logo -->
    <div class="flex items-center gap-3 px-2 mb-8">
      <div class="w-10 h-10 bg-[#0a192f] border-2 border-purple-500 flex items-center justify-center font-display font-bold text-base rounded-lg shadow-[0_0_15px_rgba(139,92,246,0.3)]">HR</div>
      <div>
        <p class="font-black text-sm leading-tight">Espace</p>
        <p class="text-purple-400 text-xs font-bold">Préfet & Disc.</p>
      </div>
    </div>

    <!-- Nav -->
    <nav class="space-y-1 flex-1">
      <div class="sidebar-link active" onclick="showView('accueil')"><i data-lucide="shield" class="w-5 h-5"></i> Contrôle Général</div>
      <div class="sidebar-link" onclick="showView('incidents')"><i data-lucide="alert-triangle" class="w-5 h-5"></i> Registre Incidents</div>
      <div class="sidebar-link" onclick="showView('absences')"><i data-lucide="user-minus" class="w-5 h-5"></i> Suivi Absences</div>
      <div class="sidebar-link" onclick="showView('rondes')"><i data-lucide="map" class="w-5 h-5"></i> Rapport de Rondes</div>
      <div class="sidebar-link" onclick="showView('rapports')"><i data-lucide="file-text" class="w-5 h-5"></i> Rapports Direction</div>
      <div class="sidebar-link" onclick="showView('classe-virtuelle')"><i data-lucide="video" class="w-5 h-5"></i> Classe Virtuelle</div>
    </nav>

    <!-- User -->
    <div class="mt-auto">
      <div class="glass-light p-4 rounded-2xl mb-3">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-purple-500/20 border border-purple-500/30 flex items-center justify-center text-purple-400 font-black text-sm" id="prefet-avatar">--</div>
          <div>
            <p class="font-bold text-sm" id="prefet-name">---</p>
            <p class="text-[11px] text-gray-400" id="prefet-role">Fonction</p>
          </div>
        </div>
      </div>
      <button onclick="localStorage.removeItem('hr_user'); localStorage.removeItem('hr_token'); window.location.href='/login.html'" class="w-full flex items-center gap-2 px-4 py-2.5 rounded-xl text-red-400 hover:bg-red-500/10 transition text-sm font-bold">
        <i data-lucide="log-out" class="w-4 h-4"></i> Déconnexion
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="md:ml-64 flex-1 p-4 md:p-8" id="main-content">
    <!-- Views dynamically injected -->
  </main>

  <script>
    const userStrP = localStorage.getItem('hr_user');
    if (!userStrP) { window.location.href = '/login.html'; throw new Error('Non connecté'); }
    const user = JSON.parse(userStrP);
    if (!user) { window.location.href = '/login.html'; throw new Error('Session invalide'); }

    const fullNameP = [user.prenom, user.nom].filter(Boolean).join(' ');
    document.getElementById('prefet-name').textContent = fullNameP || 'Inconnu';
    document.getElementById('prefet-role').textContent = user.role || 'Agent';
    const initialsP = ((user.prenom || '')[0] || '') + ((user.nom || '')[0] || '');
    document.getElementById('prefet-avatar').textContent = initialsP.toUpperCase() || '?';

    function setActiveLink(viewName) {
      document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
      const links = document.querySelectorAll('.sidebar-link');
      const map = { accueil:0, incidents:1, absences:2, rondes:3, rapports:4, 'classe-virtuelle':5 };
      if (links[map[viewName]]) links[map[viewName]].classList.add('active');
    }

    function showView(name) {
      setActiveLink(name);
      const c = document.getElementById('main-content');
      switch(name) {
        case 'accueil': c.innerHTML = viewAccueil(); break;
        case 'incidents': c.innerHTML = viewIncidents(); break;
        case 'absences': c.innerHTML = viewAbsences(); break;
        case 'rondes': c.innerHTML = viewRondes(); break;
        case 'rapports': c.innerHTML = viewRapports(); break;
        case 'classe-virtuelle':
          c.innerHTML = viewVirtualClassPrefet();
          setTimeout(() => bindVCEventsPrefet(), 50);
          break;
      }
      if (window.lucide) lucide.createIcons();
    }

    function viewVirtualClassPrefet() {
      const sessions = JSON.parse(localStorage.getItem('hr_virtual_classes_db') || '[]');
      return `
        <div class="mb-8 flex justify-between items-start">
          <div>
            <h2 class="text-3xl font-black uppercase tracking-tighter flex items-center gap-3">
              <span class="w-10 h-10 rounded-xl bg-amber-500/20 flex items-center justify-center"><i data-lucide="video" class="w-5 h-5 text-amber-400"></i></span>
              Classe Virtuelle
            </h2>
            <p class="text-xs text-gray-400 font-bold mt-1 uppercase tracking-widest">Supervision des séances en ligne — Jitsi Meet</p>
          </div>
          <div class="flex items-center gap-2 px-4 py-2 bg-amber-500/10 border border-amber-500/30 rounded-xl">
            <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
            <span class="text-xs font-black text-amber-400 uppercase tracking-widest">Jitsi Intégré</span>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

          <!-- Formulaire lancement séance -->
          <div class="glass p-6 rounded-2xl space-y-4">
            <h3 class="font-black text-sm uppercase tracking-widest text-gray-300 flex items-center gap-2">
              <i data-lucide="plus-circle" class="w-4 h-4 text-amber-400"></i>
              Ouvrir une Séance
            </h3>
            <div>
              <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Classe *</label>
              <input id="vcp-classe" type="text" placeholder="ex : 3ème Humanités"
                class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white text-sm placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-amber-500/50" />
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Objet *</label>
              <input id="vcp-objet" type="text" placeholder="ex : Réunion pédagogique"
                class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white text-sm placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-amber-500/50" />
            </div>
            <button id="vcp-start"
              class="w-full py-4 bg-gradient-to-r from-amber-500 to-amber-600 text-white font-black rounded-2xl shadow-lg hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2 text-sm uppercase tracking-wider">
              <i data-lucide="play" class="w-4 h-4"></i>
              Lancer la Séance
            </button>
          </div>

          <!-- Zone Jitsi + Historique -->
          <div class="lg:col-span-2 space-y-6">

            <div id="vcp-container" class="hidden glass p-6 rounded-2xl border border-amber-500/20">
              <div class="flex items-center justify-between mb-4">
                <h3 class="font-black text-sm uppercase tracking-widest text-amber-400 flex items-center gap-2">
                  <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                  Séance en Direct
                </h3>
                <button id="vcp-stop" class="px-4 py-2 bg-red-500/20 text-red-400 border border-red-500/30 rounded-xl text-xs font-black hover:bg-red-500/40 transition flex items-center gap-2">
                  <i data-lucide="square" class="w-3 h-3"></i> Terminer
                </button>
              </div>
              <div id="jitsi-prefet-meet" class="w-full rounded-2xl overflow-hidden" style="height:400px;background:#0a0f1e;"></div>
            </div>

            <!-- Historique toutes séances -->
            <div class="glass p-6 rounded-2xl">
              <h3 class="font-black text-sm uppercase tracking-widest text-gray-300 mb-4 flex items-center gap-2">
                <i data-lucide="history" class="w-4 h-4 text-blue-400"></i>
                Toutes les Séances (${sessions.length})
              </h3>
              <div class="space-y-3">
                ${sessions.length === 0 ? `
                  <div class="text-center py-10 text-gray-500">
                    <i data-lucide="video-off" class="w-10 h-10 mx-auto mb-3 opacity-30"></i>
                    <p class="text-sm font-medium">Aucune séance enregistrée</p>
                    <p class="text-xs mt-1 opacity-60">Les enseignants peuvent créer des séances depuis leur tableau de bord.</p>
                  </div>
                ` : sessions.slice(0, 10).map(s => `
                  <div class="flex items-center justify-between p-4 bg-white/5 border border-white/5 rounded-2xl hover:bg-white/10 transition">
                    <div class="flex items-center gap-3">
                      <div class="w-10 h-10 rounded-xl bg-amber-500/20 flex items-center justify-center">
                        <i data-lucide="video" class="w-5 h-5 text-amber-400"></i>
                      </div>
                      <div>
                        <p class="text-sm font-bold text-white">${s.subject || s.matiere || 'Séance'} — ${s.className || s.classe || ''}</p>
                        <p class="text-xs text-gray-400 mt-0.5">${s.teacher || s.enseignant || ''} • ${s.createdAt || s.date || ''}</p>
                      </div>
                    </div>
                    <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider ${s.active ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-gray-700/50 text-gray-400 border border-gray-700'}">
                      ${s.active ? 'En cours' : 'Terminée'}
                    </span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function bindVCEventsPrefet() {
      const startBtn = document.getElementById('vcp-start');
      const stopBtn  = document.getElementById('vcp-stop');

      if (startBtn) {
        startBtn.onclick = () => {
          const classe = document.getElementById('vcp-classe')?.value?.trim();
          const objet  = document.getElementById('vcp-objet')?.value?.trim();
          if (!classe || !objet) { alert('Veuillez remplir la classe et l\'objet.'); return; }

          const roomName = `HR-Prefet-${classe}-${objet}-${Date.now()}`.replace(/\s+/g, '-');
          const sessions = JSON.parse(localStorage.getItem('hr_virtual_classes_db') || '[]');
          sessions.push({ className: classe, subject: objet, teacher: '${user.prenom} ${user.nom}', roomName, active: true, createdAt: new Date().toLocaleDateString('fr-FR') });
          localStorage.setItem('hr_virtual_classes_db', JSON.stringify(sessions));

          const container = document.getElementById('vcp-container');
          const meetDiv   = document.getElementById('jitsi-prefet-meet');
          if (container) container.classList.remove('hidden');

          if (meetDiv && window.JitsiMeetExternalAPI) {
            meetDiv.innerHTML = '';
            new window.JitsiMeetExternalAPI('meet.jit.si', {
              roomName, width: '100%', height: 400, parentNode: meetDiv,
              userInfo: { displayName: fullNameP },
              configOverwrite: { startWithAudioMuted: false, startWithVideoMuted: false },
              interfaceConfigOverwrite: { SHOW_JITSI_WATERMARK: false }
            });
          } else if (meetDiv) {
            meetDiv.innerHTML = `<div class="flex flex-col items-center justify-center h-full text-gray-400 gap-4">
              <i data-lucide="video" class="w-16 h-16 opacity-30"></i>
              <p class="text-sm font-bold">Salle : ${roomName}</p>
              <a href="https://meet.jit.si/${encodeURIComponent(roomName)}" target="_blank"
                 class="px-6 py-3 bg-amber-500 text-white font-black rounded-xl hover:bg-amber-400 transition text-sm">
                Ouvrir dans Jitsi
              </a></div>`;
            if (window.lucide) lucide.createIcons();
          }
          startBtn.disabled = true;
          startBtn.classList.add('opacity-50', 'cursor-not-allowed');
        };
      }

      if (stopBtn) {
        stopBtn.onclick = () => {
          const container = document.getElementById('vcp-container');
          const meetDiv   = document.getElementById('jitsi-prefet-meet');
          if (meetDiv) meetDiv.innerHTML = '';
          if (container) container.classList.add('hidden');
          if (startBtn) { startBtn.disabled = false; startBtn.classList.remove('opacity-50','cursor-not-allowed'); }
        };
      }
    }

    function viewAccueil() {
      return `
        <div class="mb-8">
          <h2 class="text-3xl font-black uppercase tracking-tighter">Tableau de Bord Discipline</h2>
          <p class="text-xs text-gray-400 font-bold mt-1 uppercase tracking-widest">${new Date().toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'})}</p>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
          <div class="kpi-card"><div class="text-3xl font-black text-red-500 mb-1">4</div><div class="text-xs font-black text-gray-400 uppercase">Absences signalées</div></div>
          <div class="kpi-card"><div class="text-3xl font-black text-amber-500 mb-1">2</div><div class="text-xs font-black text-gray-400 uppercase">Incidents ouverts</div></div>
          <div class="kpi-card"><div class="text-3xl font-black text-purple-500 mb-1">3</div><div class="text-xs font-black text-gray-400 uppercase">Rondes effectuées</div></div>
          <div class="kpi-card"><div class="text-3xl font-black text-green-500 mb-1">100%</div><div class="text-xs font-black text-gray-400 uppercase">Rapports à jour</div></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div class="glass p-6 rounded-2xl">
            <h3 class="font-black text-base uppercase tracking-wider mb-4 text-purple-400">Actions Urgentes</h3>
            <div class="space-y-3">
              <div class="p-3 bg-red-500/10 border border-red-500/20 rounded-xl flex justify-between items-center">
                <div><p class="font-bold text-sm text-red-400">Justifier l'absence de KABONGO M.</p><p class="text-xs text-gray-400">1ère Humanités</p></div>
                <button class="px-3 py-1.5 bg-red-500 text-white rounded-lg text-xs font-black">Traiter</button>
              </div>
              <div class="p-3 bg-amber-500/10 border border-amber-500/20 rounded-xl flex justify-between items-center">
                <div><p class="font-bold text-sm text-amber-400">Bagarre signalée (Cour A)</p><p class="text-xs text-gray-400">Rapport en attente</p></div>
                <button class="px-3 py-1.5 bg-amber-500 text-[#0a192f] rounded-lg text-xs font-black">Traiter</button>
              </div>
            </div>
          </div>
          <div class="glass p-6 rounded-2xl">
            <h3 class="font-black text-base uppercase tracking-wider mb-4 text-purple-400">Transmission Rapide (Direction)</h3>
            <textarea rows="3" placeholder="Tapez un flash info à la Direction..." class="w-full px-4 py-3 bg-[#112240]/80/5 border border-white/10 rounded-xl text-white outline-none focus:ring-2 focus:ring-purple-500 resize-none mb-3"></textarea>
            <button onclick="alert('Message envoyé à la Direction Générale !')" class="w-full py-3 bg-purple-600 text-white font-black rounded-xl hover:bg-purple-500 transition shadow-[0_0_15px_rgba(147,51,234,0.3)]">
              Envoyer Alerte
            </button>
          </div>
        </div>`;
    }

    function viewIncidents() {
      return `
        <div class="mb-8 flex justify-between items-end">
          <div><h2 class="text-3xl font-black uppercase tracking-tighter">Registre des Incidents</h2><p class="text-xs text-gray-400 font-bold mt-1 uppercase tracking-widest">Suivi disciplinaire</p></div>
          <button class="px-6 py-3 bg-purple-600 text-white font-black rounded-xl flex items-center gap-2"><i data-lucide="plus"></i> Nouvel Incident</button>
        </div>
        <div class="glass p-6 rounded-2xl">
          <table class="w-full text-left">
            <thead class="text-[10px] text-gray-400 uppercase tracking-widest border-b border-white/10">
              <tr><th class="pb-4">Date</th><th class="pb-4">Élève(s) impliqué(s)</th><th class="pb-4">Motif</th><th class="pb-4">Sanction</th><th class="pb-4">Statut</th></tr>
            </thead>
            <tbody class="divide-y divide-white/5 text-sm">
              <tr>
                <td class="py-4">13/07 - 10:15</td><td class="py-4 font-bold">NKASHAMA & MUTOMBO</td><td class="py-4 text-gray-400">Altercation physique</td>
                <td class="py-4"><span class="px-2 py-1 bg-red-500/20 text-red-400 rounded text-xs">Exclusion 3 jours</span></td>
                <td class="py-4"><span class="text-amber-500 font-bold text-xs uppercase">En cours</span></td>
              </tr>
              <tr>
                <td class="py-4">12/07 - 14:00</td><td class="py-4 font-bold">TSHILANDA Alice</td><td class="py-4 text-gray-400">Téléphone en classe</td>
                <td class="py-4"><span class="px-2 py-1 bg-amber-500/20 text-amber-400 rounded text-xs">Confiscation</span></td>
                <td class="py-4"><span class="text-green-500 font-bold text-xs uppercase">Clos</span></td>
              </tr>
            </tbody>
          </table>
        </div>`;
    }

    function viewAbsences() {
        return `
        <div class="mb-8">
          <h2 class="text-3xl font-black uppercase tracking-tighter">Suivi des Absences</h2>
          <p class="text-xs text-gray-400 font-bold mt-1 uppercase tracking-widest">Contrôle des billets de justification</p>
        </div>
        <div class="glass p-6 rounded-2xl text-center py-20 text-gray-400">
            <i data-lucide="file-check-2" class="w-16 h-16 mx-auto mb-4 opacity-50"></i>
            <p class="font-bold">Module en cours de synchronisation avec les données Enseignants.</p>
        </div>`;
    }
    function viewRondes() {
        return `
        <div class="mb-8">
          <h2 class="text-3xl font-black uppercase tracking-tighter">Rapports de Rondes</h2>
          <p class="text-xs text-gray-400 font-bold mt-1 uppercase tracking-widest">Inspection des bâtiments et cours</p>
        </div>
        <div class="glass p-6 rounded-2xl text-center py-20 text-gray-400">
            <i data-lucide="map" class="w-16 h-16 mx-auto mb-4 opacity-50"></i>
            <p class="font-bold">Aucune ronde enregistrée aujourd'hui.</p>
        </div>`;
    }
    function viewRapports() {
        return `
        <div class="mb-8">
          <h2 class="text-3xl font-black uppercase tracking-tighter">Rapports Direction</h2>
          <p class="text-xs text-gray-400 font-bold mt-1 uppercase tracking-widest">Soumission officielle</p>
        </div>
        <div class="glass p-6 rounded-2xl max-w-2xl">
            <h3 class="font-black mb-4 uppercase text-sm">Rapport Journalier</h3>
            <textarea rows="6" class="w-full bg-[#112240]/80/5 border border-white/10 rounded-xl p-4 text-white mb-4 outline-none focus:ring-2 focus:ring-purple-500" placeholder="Rédigez le résumé de la journée..."></textarea>
            <button class="px-6 py-3 bg-purple-600 font-black rounded-xl shadow-[0_0_15px_rgba(147,51,234,0.3)]">Soumettre à la Direction</button>
        </div>`;
    }

    // Init & Security
    const user = JSON.parse(localStorage.getItem('hr_user'));
    if (!user) {
      window.location.href = '/login.html';
    } else {
      const allowedRoles = ['Préfet', 'D.E', 'D.D', 'Super-Admin', 'Direction'];
      if (!allowedRoles.includes(user.role)) {
        alert("⛔ ACCÈS REFUSÉ — SÉCURITÉ EPST\n\nVotre rôle ne vous donne pas accès à la Préfecture & Discipline.");
        if (user.role === 'Parent') window.location.href = '/parent-dashboard.html';
        else if (user.role === 'Enseignant' || user.role === 'Professeur') window.location.href = '/teacher-dashboard.html';
        else if (user.role === 'Comptable') window.location.href = '/compta-dashboard.html';
        else window.location.href = '/login.html';
      } else {
        const elName = document.getElementById('prefet-name');
        const elAvatar = document.getElementById('prefet-avatar');
        if (elName && user.prenom) elName.textContent = `${user.prenom} ${user.nom}`;
        if (elAvatar && user.prenom) elAvatar.textContent = `${user.prenom[0]}${user.nom[0]}`;
      }
    }
    showView('accueil');
  </script>
</body>
</html>
