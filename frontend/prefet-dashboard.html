<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Espace Pédagogie & Discipline | Harmonie-Retrouvailles</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #0a192f; }
    .font-display { font-family: 'Playfair Display', serif; }
    .glass { background: rgba(17, 34, 64, 0.75); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
    .glass-light { background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    .sidebar-link { display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;color:rgba(255,255,255,0.6);transition:all .2s;cursor:pointer; }
    .sidebar-link:hover, .sidebar-link.active { background:rgba(139,92,246,0.15);color:#fff; }
    .sidebar-link.active { border-left: 3px solid #8b5cf6; padding-left: 13px; color: #c4b5fd; }
    .kpi-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 22px; transition: all .3s; }
    .kpi-card:hover { background: rgba(255,255,255,0.07); transform: translateY(-2px); }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
  </style>
</head>
<body class="text-white min-h-screen flex flex-col md:flex-row overflow-x-hidden">

  <!-- SIDEBAR -->
  <aside class="w-full md:w-64 md:min-h-screen glass flex flex-col py-6 px-4 shrink-0 md:fixed md:left-0 md:top-0 md:bottom-0 z-40">
    <!-- Logo -->
    <div class="flex items-center gap-3 px-2 mb-8">
      <div class="w-10 h-10 bg-[#0a192f] border-2 border-purple-500 flex items-center justify-center font-display font-bold text-base rounded-lg shadow-[0_0_15px_rgba(139,92,246,0.3)] text-purple-400">HR</div>
      <div>
        <p class="font-black text-sm leading-tight uppercase" id="sidebar-role-title">Espace Direction</p>
        <p class="text-purple-400 text-[11px] font-bold" id="sidebar-inst-badge">G.S. Retrouvailles</p>
      </div>
    </div>

    <!-- Nav dynamically generated by role -->
    <nav class="space-y-1 flex-1 overflow-y-auto" id="sidebar-nav">
      <!-- Injected by JS -->
    </nav>

    <!-- User Section -->
    <div class="mt-auto pt-4 border-t border-white/10">
      <div class="glass-light p-3.5 rounded-2xl mb-3">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-purple-500/20 border border-purple-500/30 flex items-center justify-center text-purple-400 font-black text-sm" id="prefet-avatar">--</div>
          <div class="min-w-0">
            <p class="font-bold text-xs truncate" id="prefet-name">Utilisateur</p>
            <p class="text-[10px] text-purple-300 font-medium truncate" id="prefet-role">Poste Officiel</p>
          </div>
        </div>
      </div>
      <button onclick="localStorage.removeItem('hr_user'); localStorage.removeItem('hr_token'); window.location.href='/login.html'" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-red-400 hover:bg-red-500/10 transition text-xs font-bold border border-red-500/20">
        <i data-lucide="log-out" class="w-4 h-4"></i> Déconnexion
      </button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="md:ml-64 flex-1 p-4 md:p-8" id="main-content">
    <!-- Dynamic view content -->
  </main>

  <script>
    // ══════════════════════════════════════════════════════════════
    // AUTHENTIFICATION & SÉCURITÉ RBAC
    // ══════════════════════════════════════════════════════════════
    const userStr = localStorage.getItem('hr_user');
    if (!userStr) { window.location.href = '/login.html'; throw new Error('Non connecté'); }
    const user = JSON.parse(userStr);
    if (!user) { window.location.href = '/login.html'; throw new Error('Session invalide'); }

    // Rôles autorisés dans ce centre de commandement
    const allowedRoles = ['Préfet', 'D.E', 'D.D', 'Sur École', 'Directeur (D.P)', 'D.P', 'Directeur', 'Super-Admin', 'Direction', 'Direction Générale'];
    if (!allowedRoles.includes(user.role)) {
      alert("⛔ ACCÈS REFUSÉ — SÉCURITÉ EPST\n\nVotre rôle ne vous donne pas accès à cet espace administratif.");
      if (user.role === 'Parent') window.location.href = '/parent-dashboard.html';
      else if (['Enseignant', 'Professeur'].includes(user.role)) window.location.href = '/teacher-dashboard.html';
      else if (user.role === 'Comptable') window.location.href = '/compta-dashboard.html';
      else window.location.href = '/login.html';
      throw new Error('Unauthorized');
    }

    // Normalisation du rôle et de l'école
    const role = user.role;
    const ecole = user.ecole || 'Retrouvailles';
    const isRetrouvailles = ecole === 'Retrouvailles';

    // Mise à jour de l'identité
    const fullName = [user.prenom, user.nom].filter(Boolean).join(' ');
    document.getElementById('prefet-name').textContent = fullName || 'Agent EPST';
    document.getElementById('prefet-role').textContent = `${role} • ${ecole}`;
    const initials = ((user.prenom || '')[0] || '') + ((user.nom || '')[0] || '');
    document.getElementById('prefet-avatar').textContent = initials.toUpperCase() || 'AG';
    document.getElementById('sidebar-role-title').textContent = role === 'Préfet' ? 'Préfecture' : role === 'D.E' ? 'Dir. Études' : role === 'D.D' ? 'Discipline' : 'Surveillance';
    document.getElementById('sidebar-inst-badge').textContent = ecole === 'Harmonie' ? 'C.S. Harmonie' : 'G.S. Retrouvailles';

    // ══════════════════════════════════════════════════════════════
    // CHARGEMENT DES DONNÉES RÉELLES (LOCALSTORAGE)
    // ══════════════════════════════════════════════════════════════
    const allEleves = JSON.parse(localStorage.getItem('hr_eleves_db')) || [];
    const eleves = allEleves.filter(e => e.ecole === ecole && e.statut !== 'Rejeté');
    const allUsers = JSON.parse(localStorage.getItem('hr_users_db_v2')) || [];
    const enseignants = allUsers.filter(u => u.ecole === ecole && ['Enseignant', 'Professeur', 'Sur École'].includes(u.role));

    // Base de données Discipline Locale
    if (!localStorage.getItem('hr_incidents_db')) {
      localStorage.setItem('hr_incidents_db', JSON.stringify([
        { id: 1, date: '19/08/2026', heure: '08:15', eleve: 'KABONGO MUKENDI Marcel', classe: '1ère Humanités', motif: 'Retard répété (3ème fois)', sanction: 'Avertissement écrit & Billet vert', statut: 'Clos', ecole: 'Retrouvailles' },
        { id: 2, date: '19/08/2026', heure: '10:30', eleve: 'TSHILANDA Alice', classe: '3ème Sc. Électricité', motif: 'Uniforme non conforme', sanction: 'Convocation tuteur', statut: 'En cours', ecole: 'Retrouvailles' },
        { id: 3, date: '18/08/2026', heure: '11:00', eleve: 'MBAYO Patrick', classe: '5ème Primaire A', motif: 'Bagarre en récréation', sanction: 'Entretien pédagogique', statut: 'Clos', ecole: 'Harmonie' }
      ]));
    }
    let incidentsDb = JSON.parse(localStorage.getItem('hr_incidents_db')) || [];

    // Base de données Inspections & Visites de Classe
    if (!localStorage.getItem('hr_inspections_db')) {
      localStorage.setItem('hr_inspections_db', JSON.stringify([
        { id: 1, date: '18/08/2026', prof: 'Prof. ILUNGA Jacques', branche: 'Mathématique (Algèbre)', classe: '4ème Sc. Physique', note: '18/20', avis: 'Excellente tenue de la fiche pédagogique et maîtrise didactique.', ecole: 'Retrouvailles' },
        { id: 2, date: '17/08/2026', prof: 'Inst. MUKUNA Sarah', branche: 'Français (Lecture)', classe: '3ème Primaire', note: '16/20', avis: 'Bonne participation des élèves, veiller au tableau noir.', ecole: 'Harmonie' }
      ]));
    }
    let inspectionsDb = JSON.parse(localStorage.getItem('hr_inspections_db')) || [];

    // Base de données des Affectations de Classes & Horaires par le D.E (Secondaire)
    if (!localStorage.getItem('hr_affectations_db')) {
      localStorage.setItem('hr_affectations_db', JSON.stringify([
        { id: 1, teacherEmail: 'enseignant@retrouvailles.cd', teacherName: 'Prof. ILUNGA Jacques', course: 'Mathématique (Algèbre)', classe: '4ème Sc. Bio-Chimie', day: 'Lundi', timeSlot: '07h30 - 09h10 (2h)', weeklyHours: 4, ecole: 'Retrouvailles' },
        { id: 2, teacherEmail: 'enseignant@retrouvailles.cd', teacherName: 'Prof. ILUNGA Jacques', course: 'Mathématique (Algèbre)', classe: '3ème Sc. Math-Physique', day: 'Mardi', timeSlot: '09h20 - 11h00 (2h)', weeklyHours: 4, ecole: 'Retrouvailles' }
      ]));
    }
    let affectationsDb = JSON.parse(localStorage.getItem('hr_affectations_db')) || [];

    // Base de données des Titularités & Horaires Primaire par Sur École (Harmonie)
    if (!localStorage.getItem('hr_titularites_primaire_db')) {
      localStorage.setItem('hr_titularites_primaire_db', JSON.stringify([
        { id: 1, teacherEmail: 'instituteur@harmonie.cd', teacherName: 'Inst. MUKUNA Sarah', classe: '3ème Primaire', schedule: 'Lundi au Vendredi (07h30 - 12h30)', weeklyHours: 28, ecole: 'Harmonie' },
        { id: 2, teacherEmail: 'inst2@harmonie.cd', teacherName: 'Inst. KASONGO Jean', classe: '5ème Primaire', schedule: 'Lundi au Vendredi (07h30 - 12h30)', weeklyHours: 28, ecole: 'Harmonie' }
      ]));
    }
    let titularitesPrimaireDb = JSON.parse(localStorage.getItem('hr_titularites_primaire_db')) || [];

    // ══════════════════════════════════════════════════════════════
    // CONFIGURATION DE LA NAVIGATION PAR RÔLE
    // ══════════════════════════════════════════════════════════════
    const navConfigs = {
      'Préfet': [
        { id: 'accueil', label: 'Contrôle Général', icon: 'shield' },
        { id: 'charge_horaire', label: 'Charge Horaire des Profs', icon: 'clock' },
        { id: 'exetat', label: 'EXETAT & TENASOSP', icon: 'graduation-cap' },
        { id: 'deliberation', label: 'Jury Délibérations', icon: 'scale' },
        { id: 'rapports_de_dd', label: 'Rapports D.E & D.D', icon: 'file-check' },
        { id: 'correspondances', label: 'Correspondances EPST', icon: 'send' }
      ],
      'D.E': [
        { id: 'accueil', label: 'Tableau Pédagogique', icon: 'book-open' },
        { id: 'affectations', label: 'Affecter Classes & Horaires', icon: 'user-plus' },
        { id: 'horaires', label: 'Emplois du Temps Globaux', icon: 'calendar' },
        { id: 'previsions', label: 'Prévisions des Matières', icon: 'list-checks' },
        { id: 'inspections', label: 'Visites de Classes', icon: 'eye' }
      ],
      'D.D': [
        { id: 'accueil', label: 'Contrôle Disciplinaire', icon: 'shield-alert' },
        { id: 'incidents', label: 'Registre des Sanctions', icon: 'alert-triangle' },
        { id: 'billets', label: 'Billets & Justifications', icon: 'ticket' },
        { id: 'convocations', label: 'Convocations Parents', icon: 'phone-call' },
        { id: 'rondes', label: 'Rapports de Rondes', icon: 'map' }
      ],
      'Sur École': [
        { id: 'accueil', label: 'Surveillance Générale', icon: 'building-2' },
        { id: 'affectations_primaire', label: 'Classes & Horaires Inst.', icon: 'user-plus' },
        { id: 'presence_matinale', label: 'Pointage Matinal', icon: 'clipboard-check' },
        { id: 'controle_preparations', label: 'Cahiers & Fiches', icon: 'file-text' },
        { id: 'recreations', label: 'Rondes Récréations', icon: 'bell' },
        { id: 'rapport_dp', label: 'Rapport au D.P', icon: 'send' }
      ]
    };

    // Configuration par défaut selon le rôle
    const currentNav = navConfigs[role] || navConfigs['Préfet'];
    let currentView = 'accueil';

    // Rendu du menu de gauche
    function renderSidebar() {
      const navContainer = document.getElementById('sidebar-nav');
      navContainer.innerHTML = currentNav.map(item => `
        <div class="sidebar-link ${item.id === currentView ? 'active' : ''}" onclick="switchView('${item.id}')">
          <i data-lucide="${item.icon}" class="w-4 h-4"></i>
          <span>${item.label}</span>
        </div>
      `).join('');
      if (window.lucide) lucide.createIcons();
    }

    function switchView(viewId) {
      currentView = viewId;
      renderSidebar();
      renderMainContent();
    }

    // ══════════════════════════════════════════════════════════════
    // RENDU DES VUES SELON LE RÔLE
    // ══════════════════════════════════════════════════════════════
    function renderMainContent() {
      const main = document.getElementById('main-content');
      const today = new Date().toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long', year:'numeric'});

      // En-tête officiel
      let html = `
        <div class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
          <div>
            <div class="flex items-center gap-2">
              <span class="px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-purple-500/20 text-purple-400 border border-purple-500/30">
                Poste Officiel : ${role}
              </span>
              <span class="text-xs text-gray-400">• ${ecole === 'Harmonie' ? 'C.S. Harmonie (Maternelle & Primaire)' : 'G.S. Retrouvailles (Secondaire & Humanités)'}</span>
            </div>
            <h2 class="text-3xl font-black uppercase tracking-tight mt-1">Espace ${role} — ${currentNav.find(n => n.id === currentView)?.label || 'Administration'}</h2>
            <p class="text-xs text-gray-400 uppercase tracking-widest mt-0.5">${today} • Registre Pédagogique & Disciplinaire</p>
          </div>
          <div class="flex items-center gap-3">
            <div class="px-4 py-2 bg-purple-500/10 border border-purple-500/20 rounded-xl flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              <span class="text-xs font-bold text-gray-300">${eleves.length} Élève(s) actif(s)</span>
            </div>
          </div>
        </div>
      `;

      // Dispatch selon le rôle et la vue
      if (role === 'Préfet') {
        if (currentView === 'accueil') html += viewPrefetAccueil();
        else if (currentView === 'charge_horaire') html += viewPrefetChargeHoraire();
        else if (currentView === 'exetat') html += viewPrefetExetat();
        else if (currentView === 'deliberation') html += viewPrefetDeliberation();
        else if (currentView === 'rapports_de_dd') html += viewPrefetRapports();
        else if (currentView === 'correspondances') html += viewPrefetCorrespondances();
      } else if (role === 'D.E') {
        if (currentView === 'accueil') html += viewDEAccueil();
        else if (currentView === 'affectations') html += viewDEAffectations();
        else if (currentView === 'horaires') html += viewDEHoraires();
        else if (currentView === 'previsions') html += viewDEPrevisions();
        else if (currentView === 'inspections') html += viewDEInspections();
      } else if (role === 'D.D') {
        if (currentView === 'accueil') html += viewDDAccueil();
        else if (currentView === 'incidents') html += viewDDIncidents();
        else if (currentView === 'billets') html += viewDDBillets();
        else if (currentView === 'convocations') html += viewDDConvocations();
        else if (currentView === 'rondes') html += viewDDRondes();
      } else if (role === 'Sur École') {
        if (currentView === 'accueil') html += viewSurEcoleAccueil();
        else if (currentView === 'affectations_primaire') html += viewSurEcoleAffectations();
        else if (currentView === 'presence_matinale') html += viewSurEcolePresence();
        else if (currentView === 'controle_preparations') html += viewSurEcoleCahiers();
        else if (currentView === 'recreations') html += viewSurEcoleRecreations();
        else if (currentView === 'rapport_dp') html += viewSurEcoleRapportDP();
      } else {
        html += viewGenericDashboard();
      }

      main.innerHTML = html;
      if (window.lucide) lucide.createIcons();
    }

    // ══════════════════════════════════════════════════════════════
    // VUES : PRÉFET DES ÉTUDES (G.S. RETROUVAILLES)
    // ══════════════════════════════════════════════════════════════
    function viewPrefetAccueil() {
      const candidatsExetat = eleves.filter(e => e.classe && (e.classe.includes('6ème') || e.classe.includes('4ème Hum')));
      const incidentsRetr = incidentsDb.filter(i => i.ecole === ecole);

      return `
        <!-- KPIs Préfet -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
          <div class="kpi-card">
            <div class="text-xs font-black text-purple-400 uppercase tracking-widest mb-1">Effectif Secondaire</div>
            <div class="text-3xl font-black text-white">${eleves.length}</div>
            <p class="text-[10px] text-gray-400 mt-1">Inscrits officiels EB & Humanités</p>
          </div>
          <div class="kpi-card">
            <div class="text-xs font-black text-emerald-400 uppercase tracking-widest mb-1">Candidats EXETAT</div>
            <div class="text-3xl font-black text-emerald-400">${candidatsExetat.length || 24}</div>
            <p class="text-[10px] text-gray-400 mt-1">Fiches E01 validées</p>
          </div>
          <div class="kpi-card">
            <div class="text-xs font-black text-amber-400 uppercase tracking-widest mb-1">Corps Professoral</div>
            <div class="text-3xl font-black text-amber-400">${enseignants.length || 14}</div>
            <p class="text-[10px] text-gray-400 mt-1">Professeurs en fonction</p>
          </div>
          <div class="kpi-card">
            <div class="text-xs font-black text-blue-400 uppercase tracking-widest mb-1">Incidents Signalés</div>
            <div class="text-3xl font-black text-blue-400">${incidentsRetr.length}</div>
            <p class="text-[10px] text-gray-400 mt-1">Dossiers transmis par le D.D</p>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <!-- Supervision Pédagogique (Rapports D.E) -->
          <div class="glass p-6 rounded-3xl border border-white/10">
            <div class="flex items-center justify-between mb-4">
              <h3 class="font-black text-sm uppercase tracking-wider flex items-center gap-2 text-purple-300">
                <i data-lucide="book-open" class="w-4 h-4"></i> Synthèse Pédagogique (Direction des Études)
              </h3>
              <button onclick="switchView('charge_horaire')" class="text-xs text-purple-400 hover:underline">Voir Charge Horaire</button>
            </div>
            <div class="space-y-3">
              <div class="p-3.5 bg-white/5 border border-white/5 rounded-2xl">
                <div class="flex justify-between items-center text-xs font-bold mb-1.5">
                  <span class="text-white">Avancement Global des Matières</span>
                  <span class="text-emerald-400">88.5%</span>
                </div>
                <div class="w-full bg-white/10 h-2 rounded-full overflow-hidden">
                  <div class="bg-gradient-to-r from-purple-500 to-emerald-400 h-full rounded-full" style="width: 88.5%"></div>
                </div>
              </div>
              <div class="p-3.5 bg-white/5 border border-white/5 rounded-2xl">
                <div class="flex justify-between items-center text-xs font-bold mb-1.5">
                  <span class="text-white">Couverture Humanités Techniques (Électricité & Gestion)</span>
                  <span class="text-amber-400">82.0%</span>
                </div>
                <div class="w-full bg-white/10 h-2 rounded-full overflow-hidden">
                  <div class="bg-gradient-to-r from-amber-500 to-amber-300 h-full rounded-full" style="width: 82%"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Supervision Disciplinaire (Rapports D.D) -->
          <div class="glass p-6 rounded-3xl border border-white/10">
            <div class="flex items-center justify-between mb-4">
              <h3 class="font-black text-sm uppercase tracking-wider flex items-center gap-2 text-amber-300">
                <i data-lucide="shield" class="w-4 h-4"></i> Registre de Discipline (Direction de Discipline)
              </h3>
              <button onclick="switchView('rapports_de_dd')" class="text-xs text-amber-400 hover:underline">Consulter</button>
            </div>
            <div class="space-y-2.5">
              ${incidentsRetr.slice(0, 3).map(i => `
                <div class="p-3 bg-white/5 border border-white/5 rounded-2xl flex items-center justify-between">
                  <div>
                    <p class="text-xs font-bold text-white">${i.eleve} <span class="text-[10px] text-gray-400 font-normal">(${i.classe})</span></p>
                    <p class="text-[10px] text-gray-400">${i.motif} • Sanction : ${i.sanction}</p>
                  </div>
                  <span class="text-[9px] font-black uppercase px-2 py-0.5 rounded-full ${i.statut === 'Clos' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}">${i.statut}</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function viewPrefetChargeHoraire() {
      const profs = allUsers.filter(u => u.ecole === 'Retrouvailles' && ['Enseignant', 'Professeur'].includes(u.role));
      const affectations = JSON.parse(localStorage.getItem('hr_affectations_db')) || [];

      return `
        <div class="glass p-6 rounded-3xl border border-white/10">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
            <div>
              <h3 class="font-black text-lg text-white uppercase tracking-wider flex items-center gap-2">
                <i data-lucide="clock" class="w-5 h-5 text-purple-400"></i> Charge Horaire des Professeurs (G.S. Retrouvailles)
              </h3>
              <p class="text-xs text-gray-400">Contrôle officiel de la charge hebdomadaire selon les normes de l'EPST (18h à 24h)</p>
            </div>
            <button onclick="window.print()" class="px-4 py-2 bg-purple-600/20 hover:bg-purple-600/30 text-purple-300 border border-purple-500/30 font-bold text-xs rounded-xl flex items-center gap-2 transition">
              <i data-lucide="printer" class="w-4 h-4"></i> Imprimer Tableau Officiel
            </button>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead class="text-[10px] uppercase text-gray-400 border-b border-white/10 pb-3">
                <tr>
                  <th class="pb-3 px-3">Professeur</th>
                  <th class="pb-3 px-3">Diplôme / Spécialité</th>

                  return `

    window.onTeacherSelected = function(email) {
      const select = document.getElementById('aff-prof-select');
      const selectedOption = select.options[select.selectedIndex];
      const declared = selectedOption.getAttribute('data-courses');
      const displayEl = document.getElementById('aff-declared-courses');
      if (declared && declared.trim() !== '') {
        displayEl.textContent = declared.replace(/\|/g, ', ');
      } else {
        displayEl.textContent = "Aucun cours spécifique déclaré (Affectation libre par le D.E)";
      }
    };

    window.saveAffectationDE = function() {
      const select = document.getElementById('aff-prof-select');
      const email = select.value;
      if (!email) { alert('Veuillez sélectionner un professeur.'); return; }
      const teacherName = select.options[select.selectedIndex].getAttribute('data-name') || 'Professeur';
      const course = document.getElementById('aff-course').value;
      const classe = document.getElementById('aff-classe').value;
      const day = document.getElementById('aff-day').value;
      const hours = parseInt(document.getElementById('aff-hours').value) || 4;
      const timeSlot = document.getElementById('aff-timeslot').value;

      const newAff = {
        id: Date.now(),
        teacherEmail: email,
        teacherName,
        course,
        classe,
        day,
        weeklyHours: hours,
        timeSlot,
        ecole: 'Retrouvailles'
      };

      let affs = JSON.parse(localStorage.getItem('hr_affectations_db')) || [];
      affs.unshift(newAff);
      localStorage.setItem('hr_affectations_db', JSON.stringify(affs));

      // Mettre à jour l'utilisateur dans hr_users_db_v2 pour synchroniser son teacher-dashboard
      let usersDb = JSON.parse(localStorage.getItem('hr_users_db_v2')) || [];
      const userIdx = usersDb.findIndex(u => u.email === email);
      if (userIdx !== -1) {
        if (!usersDb[userIdx].assignedClasses) usersDb[userIdx].assignedClasses = [];
        if (!usersDb[userIdx].assignedClasses.includes(classe)) {
          usersDb[userIdx].assignedClasses.push(classe);
        }
        localStorage.setItem('hr_users_db_v2', JSON.stringify(usersDb));
      }

      alert(`Succès ! La classe "${classe}" et le cours "${course}" (${hours}h/sem) ont été affectés au ${teacherName}.`);
      switchView('affectations');
    };

    window.deleteAffectationDE = function(id) {
      if (!confirm('Confirmez-vous le retrait de cette affectation de classe ?')) return;
      let affs = JSON.parse(localStorage.getItem('hr_affectations_db')) || [];
      affs = affs.filter(a => a.id !== id);
      localStorage.setItem('hr_affectations_db', JSON.stringify(affs));
      switchView('affectations');
    };

    // MODULE SUR ÉCOLE : AFFECTATION DES CLASSES ET HORAIRES DES INSTITUTEURS DU PRIMAIRE (HARMONIE)

            <h3 class="font-black text-sm uppercase tracking-wider text-emerald-300 mb-2 flex items-center gap-2">

                <label class="block font-bold text-gray-300 mb-1">Instituteur / Institutrice *</label>
                <select id="aff-inst-select" class="w-full px-3.5 py-2.5 bg-[#0a192f] border border-white/10 rounded-xl text-white outline-none focus:border-emerald-500">

                </select>
              </div>

              <div>
                <label class="block font-bold text-gray-300 mb-1">Classe Titulaire (Primaire / Maternelle) *</label>
                <select id="aff-inst-classe" class="w-full px-3.5 py-2.5 bg-[#0a192f] border border-white/10 rounded-xl text-white outline-none">
                  <optgroup label="Maternelle">
                    <option value="Maternelle - Petite Section">Maternelle - Petite Section</option>
                    <option value="Maternelle - Moyenne Section">Maternelle - Moyenne Section</option>
                    <option value="Maternelle - Grande Section">Maternelle - Grande Section</option>
                  </optgroup>
                  <optgroup label="Primaire">
                    <option value="1ère Primaire A">1ère Primaire A</option>
                    <option value="1ère Primaire B">1ère Primaire B</option>
                    <option value="2ème Primaire A">2ème Primaire A</option>
                    <option value="2ème Primaire B">2ème Primaire B</option>
                    <option value="3ème Primaire" selected>3ème Primaire</option>
                    <option value="4ème Primaire">4ème Primaire</option>
                    <option value="5ème Primaire">5ème Primaire</option>
                    <option value="6ème Primaire (ENAFEP)">6ème Primaire (ENAFEP)</option>
                  </optgroup>
                </select>
              </div>

              <div>
                <label class="block font-bold text-gray-300 mb-1">Régime Horaire Officiel (EPST) *</label>
                <select id="aff-inst-schedule" class="w-full px-3.5 py-2.5 bg-[#0a192f] border border-white/10 rounded-xl text-white outline-none">
                  <option value="Lundi au Vendredi (07h30 - 12h30) — 28h/sem">Lundi au Vendredi (07h30 - 12h30) — 28h / semaine (Temps plein EPST)</option>
                  <option value="Lundi au Vendredi (08h00 - 12h00) — 20h/sem (Maternelle)">Lundi au Vendredi (08h00 - 12h00) — 20h / semaine (Maternelle)</option>
                </select>
              </div>

              <button onclick="saveTitulariteSurEcole()" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-gray-950 font-black text-xs uppercase tracking-wider rounded-xl transition shadow-lg shadow-emerald-500/20">
                Attribuer la Classe & l'Horaire
              </button>
            </div>
          </div>

          <div class="lg:col-span-2 glass p-6 rounded-3xl border border-white/10">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h3 class="font-black text-sm uppercase tracking-wider text-white">Tableau des Titularités du Primaire</h3>
                <p class="text-xs text-gray-400">Attribution des classes et respect des 28h hebdomadaires</p>
              </div>
              <span class="px-3 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-xl text-xs font-bold">
                ${titularites.length} Titulaire(s)
              </span>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead class="text-[10px] uppercase text-gray-400 border-b border-white/10 pb-3">
                  <tr>
                    <th class="pb-3 px-3">Instituteur</th>
                    <th class="pb-3 px-3">Classe Titulaire</th>
                    <th class="pb-3 px-3">Horaire EPST</th>
                    <th class="pb-3 px-3 text-center">Charge</th>
                    <th class="pb-3 px-3 text-right">Action</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-white/5">
                  ${titularites.map(t => `
                    <tr class="hover:bg-white/5">
                      <td class="py-3 px-3 font-bold text-white">${t.teacherName}</td>
                      <td class="py-3 px-3"><span class="px-2.5 py-1 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold">${t.classe}</span></td>
                      <td class="py-3 px-3 text-gray-300">${t.schedule}</td>
                      <td class="py-3 px-3 text-center font-mono font-bold text-emerald-400">${t.weeklyHours}h/sem</td>
                      <td class="py-3 px-3 text-right">
                        <button onclick="deleteTitularite(${t.id})" class="px-2 py-1 text-red-400 hover:bg-red-500/10 rounded font-bold text-[10px]">
                          Retirer
                        </button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    window.saveTitulariteSurEcole = function() {
      const select = document.getElementById('aff-inst-select');
      const email = select.value;
      if (!email) { alert('Veuillez sélectionner un instituteur.'); return; }
      const teacherName = select.options[select.selectedIndex].getAttribute('data-name') || 'Instituteur';
      const classe = document.getElementById('aff-inst-classe').value;
      const schedule = document.getElementById('aff-inst-schedule').value;

      const newTit = {
        id: Date.now(),
        teacherEmail: email,
        teacherName,
        classe,
        schedule,
        weeklyHours: schedule.includes('20h') ? 20 : 28,
        ecole: 'Harmonie'
      };

      let tits = JSON.parse(localStorage.getItem('hr_titularites_primaire_db')) || [];
      tits.unshift(newTit);
      localStorage.setItem('hr_titularites_primaire_db', JSON.stringify(tits));

      // Mettre à jour dans hr_users_db_v2
      let usersDb = JSON.parse(localStorage.getItem('hr_users_db_v2')) || [];
      const userIdx = usersDb.findIndex(u => u.email === email);
      if (userIdx !== -1) {
        usersDb[userIdx].classeTitulaire = classe;
        usersDb[userIdx].schedule = schedule;
        if (!usersDb[userIdx].assignedClasses) usersDb[userIdx].assignedClasses = [];
        if (!usersDb[userIdx].assignedClasses.includes(classe)) usersDb[userIdx].assignedClasses.push(classe);
        localStorage.setItem('hr_users_db_v2', JSON.stringify(usersDb));
      }

      alert(`Succès ! La classe ${classe} et l'horaire ont été attribués à ${teacherName}.`);
      switchView('affectations_primaire');
    };

    window.deleteTitularite = function(id) {
      if (!confirm('Confirmez-vous le retrait de cette titularité ?')) return;
      let tits = JSON.parse(localStorage.getItem('hr_titularites_primaire_db')) || [];
      tits = tits.filter(t => t.id !== id);
      localStorage.setItem('hr_titularites_primaire_db', JSON.stringify(tits));
      switchView('affectations_primaire');
    };
