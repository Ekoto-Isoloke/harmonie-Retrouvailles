<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Enregistrement Biométrique – Harmonie Retrouvailles</title>
  <meta name="description" content="Enregistrez votre empreinte digitale via WebAuthn pour sécuriser votre compte." />
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f0f4ff, #e0e7ff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 2rem 3rem;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    h1 { font-size: 1.8rem; color: #1e1b4b; margin-bottom: 0.5rem; }
    p { color: #4b5563; margin-bottom: 1.5rem; }
    button {
      background: linear-gradient(90deg, #4f46e5, #6366f1);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99,102,241,.25); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .success {
      margin-top: 1.5rem;
      background: #d1fae5;
      border: 1px solid #10b981;
      border-radius: 12px;
      padding: 1rem;
      color: #065f46;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Enregistrement Biométrique</h1>
    <p>Utilisez le capteur d'empreinte (ou Windows Hello / Touch ID) pour sécuriser votre compte.</p>
    <button id="btn-enroll">Enregistrer l'empreinte</button>
    <div id="result"></div>
  </div>
  <script src="src/biometric.js"></script>
</body>
</html>
