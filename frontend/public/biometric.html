<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Enregistrement Biométrique – Harmonie Retrouvailles</title>
  <meta name="description" content="Enregistrez votre empreinte digitale via WebAuthn pour sécuriser votre compte." />
  <style>
    body {margin:0;font-family:'Inter',sans-serif;background:linear-gradient(135deg,#f0f4ff,#e0e7ff);display:flex;justify-content:center;align-items:center;min-height:100vh;}
    .card {background:rgba(255,255,255,0.9);backdrop-filter:blur(12px);border-radius:20px;padding:2rem 3rem;box-shadow:0 12px 30px rgba(0,0,0,0.08);text-align:center;max-width:420px;width:100%;}
    h1{font-size:1.8rem;color:#1e1b4b;margin-bottom:.5rem;}
    p{color:#4b5563;margin-bottom:1.5rem;}
    button{background:linear-gradient(90deg,#4f46e5,#6366f1);color:white;border:none;border-radius:12px;padding:.75rem 1.5rem;font-size:1rem;cursor:pointer;transition:transform .2s,box-shadow .2s;}
    button:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(99,102,241,.25);}
    button:disabled{opacity:.6;cursor:not-allowed;}
    .success,.error{margin-top:1.5rem;padding:1rem;border-radius:12px;}
    .success{background:#d1fae5;border:1px solid #10b981;color:#065f46;}
    .error{background:#fee2e2;border:1px solid #ef4444;color:#991b1b;}
  </style>
</head>
<body>
  <div class="card">
    <h1>Enregistrement Biométrique</h1>
    <p>Utilisez le capteur d'empreinte (ou Windows Hello / Touch ID) pour sécuriser votre compte.</p>
    <button id="btn-enroll">Enregistrer l'empreinte</button>
    <div id="result"></div>
  </div>
  <script>
    (function(){
      const btn=document.getElementById('btn-enroll');
      const result=document.getElementById('result');
      const bufferToBase64Url=buffer=>btoa(String.fromCharCode(...new Uint8Array(buffer))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
      const base64UrlToBuffer=base64url=>{const padding='='.repeat((4-(base64url.length%4))%4);const base64=(base64url+padding).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(base64);const buf=new ArrayBuffer(raw.length);const view=new Uint8Array(buf);for(let i=0;i<raw.length;i++)view[i]=raw.charCodeAt(i);return buf;};
      const show=(msg,err)=>{result.innerHTML=`<div class="${err?'error':'success'}">${msg}</div>`;};
      const register=async()=>{btn.disabled=true;btn.textContent='Enregistrement…';try{const optResp=await fetch('/api/biometric/register-options',{method:'GET',credentials:'include'});if(!optResp.ok)throw new Error('Impossible d’obtenir les options d’enregistrement.');const opts=await optResp.json();opts.challenge=base64UrlToBuffer(opts.challenge);if(opts.user && opts.user.id)opts.user.id=base64UrlToBuffer(opts.user.id);if(opts.excludeCredentials)opts.excludeCredentials=opts.excludeCredentials.map(c=>({...c,id:base64UrlToBuffer(c.id)}));const cred=await navigator.credentials.create({publicKey:opts});if(!cred)throw new Error('Aucun credential créé.');const credResp={id:cred.id,rawId:bufferToBase64Url(cred.rawId),type:cred.type,response:{attestationObject:bufferToBase64Url(cred.response.attestationObject),clientDataJSON:bufferToBase64Url(cred.response.clientDataJSON)}};const verifyResp=await fetch('/api/biometric/enroll',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(credResp)});if(!verifyResp.ok)throw new Error('Échec de la vérification serveur.');await verifyResp.json();show('✅ Empreinte enregistrée avec succès ! Vous pouvez maintenant vous connecter.',false);}catch(e){console.error(e);show(`❌ ${e.message}`,true);}finally{btn.disabled=false;btn.textContent="Enregistrer l'empreinte";}};btn.addEventListener('click',register);
    })();
  </script>
</body>
</html>
